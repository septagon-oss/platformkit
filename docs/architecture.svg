<text x="326.0" y="392" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#e2e8f0">pk-apps/pkg/starterapp</text>
<text x="326.0" y="411" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">one canonical composition; WithModules is the only extension seam</text>
  <rect x="616" y="366" width="542" height="58" rx="9" fill="none" stroke="#7c3aed"/>
<text x="887.0" y="392" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#60a5fa">pk-apps/reference/</text>
