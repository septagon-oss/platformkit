<text x="891.0" y="524" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#e2e8f0">pk-testkit</text>
<text x="891.0" y="543" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">conformance</text>
  <rect x="996" y="498" width="162" height="58" rx="9" fill="#1e293b" stroke="#334155"/>
<text x="1077.0" y="524" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#e2e8f0">pk-tools</text>
<text x="1077.0" y="543" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">CLI and scaffold</text>

  <text x="24" y="612" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8">Modules depend on published interfaces, never on one another's concrete types. Identifiers cross HTTP as one canonical opaque segment; slugs stay readable.</text>
  <text x="24" y="634" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8">SQLite is the zero-setup default. Extension code is Go — schemas are modules compiled in, not collections defined at runtime.</text>
</svg>
