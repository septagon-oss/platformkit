<text x="712.0" y="146" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="600" fill="#15221f">pk-shared</text>
<text x="712.0" y="163" text-anchor="middle" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#5f6b65">vocabulary and primitives</text>
  <rect x="844" y="120" width="300" height="56" fill="#fffdf7" stroke="#cbc5b8" stroke-width="1"/>
<text x="994.0" y="146" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="600" fill="#15221f">pk-runtime</text>
<text x="994.0" y="163" text-anchor="middle" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#5f6b65">host, request, health, HTTP</text>

