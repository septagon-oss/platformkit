  <rect x="28" y="332" width="1144" height="104" fill="none" stroke="#cbc5b8"/><text x="44" y="352" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="0.16em" fill="#0f5d4e">MODULES</text>
