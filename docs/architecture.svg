<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="PlatformKit layered architecture: contracts and tokens at the foundation, a runtime host, nine reference modules that talk only through published ports, one composition in pk-apps, and the platformkit front door; client, testkit and tools sit alongside">
