<text x="600.0" y="386" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="600" fill="#15221f">pk-modules</text>
<text x="600.0" y="403" text-anchor="middle" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#5f6b65">tenant · user · auth · api_key · audit · content · notification · admin (serves the four-layer stylesheet) · health</text>

  <path d="M 206 436 L 206 466" stroke="#8f988f" stroke-width="1.4" fill="none"/>
<path d="M 202.5 466 L 206 472 L 209.5 466 Z" fill="#8f988f"/>
<text x="217" y="458" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#5f6b65">composed by</text>
  <rect x="28" y="452" width="1144" height="104" fill="none" stroke="#cbc5b8"/><text x="44" y="472" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="0.16em" fill="#0f5d4e">COMPOSITION</text>
  <rect x="56" y="480" width="540" height="56" fill="#fffdf7" stroke="#cbc5b8" stroke-width="1"/>
<text x="326.0" y="506" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="600" fill="#15221f">pk-apps/pkg/starterapp</text>
<text x="326.0" y="523" text-anchor="middle" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#5f6b65">one canonical composition; WithModules is the only extension seam</text>
  <rect x="616" y="480" width="528" height="56" fill="none" stroke="#0f5d4e" stroke-width="1"/>
<text x="880.0" y="506" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="600" fill="#0f5d4e">pk-apps/reference/</text>
<text x="880.0" y="523" text-anchor="middle" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#0f5d4e">custommodule · polls (module-owned admin page on pk-ui)</text>

  <path d="M 206 556 L 206 586" stroke="#0f5d4e" stroke-width="1.4" fill="none"/>
<path d="M 202.5 586 L 206 592 L 209.5 586 Z" fill="#0f5d4e"/>
<text x="217" y="578" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#5f6b65">run by</text>
  <rect x="28" y="572" width="1144" height="104" fill="none" stroke="#cbc5b8"/><text x="44" y="592" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="0.16em" fill="#0f5d4e">ENTRY POINT</text>
  <rect x="56" y="600" width="540" height="56" fill="#d8f35d" stroke="#15221f" stroke-width="1.5"/>
<text x="326.0" y="626" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="600" fill="#15221f">platformkit</text>
<text x="326.0" y="643" text-anchor="middle" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#15221f">go run github.com/septagon-oss/platformkit@latest</text>
  <rect x="616" y="600" width="168" height="56" fill="#fffdf7" stroke="#cbc5b8" stroke-width="1"/>
<text x="700.0" y="626" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="600" fill="#15221f">pk-client</text>
<text x="700.0" y="643" text-anchor="middle" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#5f6b65">call the API</text>
  <rect x="800" y="600" width="168" height="56" fill="#fffdf7" stroke="#cbc5b8" stroke-width="1"/>
<text x="884.0" y="626" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="600" fill="#15221f">pk-testkit</text>
<text x="884.0" y="643" text-anchor="middle" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#5f6b65">conformance</text>
  <rect x="984" y="600" width="160" height="56" fill="#fffdf7" stroke="#cbc5b8" stroke-width="1"/>
<text x="1064.0" y="626" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="600" fill="#15221f">pk-tools</text>
<text x="1064.0" y="643" text-anchor="middle" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="11.5" fill="#5f6b65">CLI and scaffold</text>

  <text x="28" y="700" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="12.5" fill="#5f6b65">Modules depend on published interfaces, never on one another's concrete types. Components declare their classes as values; the stylesheet derives from the declarations.</text>
  <text x="28" y="722" font-family="'IBM Plex Sans',Aptos,'Helvetica Neue',sans-serif" font-size="12.5" fill="#5f6b65">Identifiers cross HTTP as one canonical opaque segment; slugs stay readable. SQLite is the zero-setup default. Extension code is Go.</text>
</svg>
