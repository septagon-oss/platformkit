# Local dependencies for `make run` and `make test`. Port 5432 is free: the
# private workspace this repository is extracted from uses 5433, so both can run.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: platformkit
      POSTGRES_DB: platformkit
    ports:
      - "5432:5432"
    volumes:
      # Runs once, on an empty data directory, and creates the unprivileged
      # role the app connects as. See the comments in the file.
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platformkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    # The scratch-based `nats:2` holds nothing but the server binary, so it
    # cannot probe itself; the alpine variant of the same server can.
    image: nats:2-alpine
    command: ["--jetstream", "--http_port", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
