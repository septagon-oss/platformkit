# Local dependencies for `make run`, `make test` and `make check`. Every published
# port is overridable so this stack can run beside another Postgres, NATS, Valkey or
# object store: PLATFORMKIT_PG_PORT, PLATFORMKIT_NATS_PORT, PLATFORMKIT_VALKEY_PORT
# and PLATFORMKIT_S3_PORT. `make test` and `make check` read the same variables, so
# overriding them once is enough.
#
# One further service sits behind the `telemetry` profile and so takes no part in
# `make up`: see `make trace`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: platformkit
      POSTGRES_DB: platformkit
    ports:
      - "${PLATFORMKIT_PG_PORT:-5432}:5432"
    volumes:
      # Runs once, on an empty data directory, and creates the unprivileged
      # role the app connects as. See the comments in the file.
      - ./apps/platformkit/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platformkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    # The scratch-based `nats:2` holds nothing but the server binary, so it
    # cannot probe itself; the alpine variant of the same server can.
    image: nats:2-alpine
    command: ["--jetstream", "--http_port", "8222"]
    ports:
      - "${PLATFORMKIT_NATS_PORT:-4222}:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  collector:
    # The local trace backend: `make trace` starts it, and
    # telemetry.otlp_endpoint http://localhost:4317 (or localhost:4317) is what
    # points the application at it. It prints every span and metric datapoint it
    # receives to this container's log — `docker compose logs collector` — and
    # keeps nothing, so a developer sees the four kernel boundaries traced on
    # their own machine without a trace backend. deploy/otel-collector.yaml is
    # its configuration.
    #
    # A profile, and not in `make up`, because that goal is what `make test` and
    # `make check` sit on: a service that has to be pulled before the database
    # is usable would make an offline checkout untestable, and an image that is
    # not started is no worse than the one that is not configured.
    #
    # No healthcheck: the release image is scratch-based, so it carries nothing
    # to probe with — no wget, no shell — and a probe written as
    # `otelcol --version` would report that a binary exists rather than that it
    # is listening. `--wait` therefore waits for this one to be running, which
    # for a service with no dependencies is the whole of readiness.
    # No restart policy, which is a choice rather than a default left alone: a
    # container that restarts itself hides the fact that it died, and the one
    # thing a local backend has to do is admit it is not running. `make trace`
    # recreates it on every call, so a laptop that slept over the weekend gets a
    # fresh one when somebody asks for it.
    image: otel/opentelemetry-collector:0.116.1
    profiles: ["telemetry"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${PLATFORMKIT_OTLP_PORT:-4317}:4317"

  valkey:
    # The shared store kit/cache/providers/valkey answers to, and the store whose
    # conformance run `make check` takes when this is up. Nothing is stored here that
    # a replica may not recompute: sessions, grants and entitlements never are, so a
    # suspension is the worst thing an entry can be wrong about and it is wrong for
    # hostTTL at most.
    #
    # noeviction is not politeness, it is the requirement kit/cache states: the
    # counter a Move raises carries no TTL, an evicted counter reads back as
    # generation 0, and the entries the first Move closed are believed again.
    image: valkey/valkey:8-alpine
    command: ["--maxmemory-policy", "noeviction"]
    ports:
      - "${PLATFORMKIT_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    # The S3-compatible object store modules/file's S3 adapter is tested against
    # (file.S3). SeaweedFS because it is Apache-2.0 and its image pulls without a
    # registry login; the adapter speaks plain S3 through minio-go, so any
    # S3-compatible store serves in its place. The credentials are this local
    # stack's and nobody else's, and the bucket each test run makes is its own.
    # Published on 8333 whatever else this stack is on: no other service of this
    # repository answers there.
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: pkittest
      AWS_SECRET_ACCESS_KEY: pkittestsecret
    ports:
      - "${PLATFORMKIT_S3_PORT:-8333}:8333"
    healthcheck:
      # Is the S3 endpoint answering? An anonymous bucket list is refused by
      # design (403), and the refusal is the answer this probe wants, so the
      # probe is a plain request whose exit code means "somebody is listening at
      # the port the adapter dials" — curl without -f, which is exactly the flag
      # that distinguishes "answered 403" from "nobody home". `make up` passes
      # --wait, so a probe that can never be satisfied is a stack that never
      # starts.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 5s
      retries: 10
