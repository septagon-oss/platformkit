apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: platformkit
spec: {}
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: admin
spec:
  type: service
  lifecycle: production
  owner: platformkit
  system: platformkit
  providesApis:
    - api:admin-http
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: audit
spec:
  type: service
  lifecycle: production
  owner: platformkit
  system: platformkit
  dependsOn:
    - component:auth
    - component:billing
    - component:content
    - component:file
    - component:notification
    - component:site
    - component:task
    - component:tenant
    - component:user
  providesApis:
    - api:audit-http
  consumesApis:
    - api:auth-events
    - api:billing-events
    - api:content-events
    - api:file-events
    - api:notification-events
    - api:site-events
    - api:task-events
    - api:tenant-events
    - api:user-events
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: auth
spec:
  type: service
  lifecycle: production
  owner: platformkit
  system: platformkit
  dependsOn:
    - component:user
  providesApis:
    - api:auth-events
    - api:auth-http
  consumesApis:
    - api:user-events
---
apiVersion: backstage.io/v1alpha1
