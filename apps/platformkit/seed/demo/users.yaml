# Three people, so a demonstration has somebody to assign work to and somebody
# to refuse. An invitation carries no password — the loader refuses a field named
# for one — so what this file declares is each person's roles, and the one word
# `signIn` says whether they can sign in at all.
#
# "demo" is not a secret and never one: it asks the application to give this
# person the demo password the deployment holds (config `demo.password`,
# PLATFORMKIT_DEMO_PASSWORD). Where a deployment names none, the run mints one
# for this person, gives it through the same command, and prints it once to
# stderr — an invited person nobody can sign in as is not a walkthrough. What the
# comparison asks is whether the row holds a credential at all, so the person who
# later chooses their own password keeps it: no rerun writes over a credential. What arrives through SetPassword is the module's own
# command, hashed by the module and announced by its own user.password_set event.
#
# The roles are the ones this application composes: auth's member, which grants
# nothing until somebody grants it, and the two personas every tenant is created
# with. They arrive through user.SetRoles, so the trail says which command gave
# them, and a person can be shown the difference between the three at the task
# desk without anybody editing a table.
apiVersion: platformkit.seed/v1
resource: users
records:
  - key: marta@example.test
    fields:
      displayName: Marta Oliveira
      roles: [coordinator]
      signIn: demo
  - key: devin@example.test
    fields:
      displayName: Devin Ali
      roles: [observer]
      signIn: demo
  - key: amara@example.test
    fields:
      displayName: Amara Bock
      roles: [member]
      signIn: demo
