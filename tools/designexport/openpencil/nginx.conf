# Local static-image contract. The deployment chart supplies its own policy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /platformkit-provenance.json {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        return 410;
    }
    location ~* \.ttf$ {
        default_type font/ttf;
        try_files $uri =404;
    }
    location ~* \.(js|css|wasm|ttf|woff2?|otf|json|png|svg|ico|fig)$ {
        try_files $uri =404;
    }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
