name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# One run per branch. A superseded push has nothing left to prove.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: platformkit
          POSTGRES_DB: platformkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platformkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Service containers ignore /docker-entrypoint-initdb.d, so the role that
      # compose creates on first boot is created here by hand, from the same file.
      # Service containers cannot take a command, and NATS needs --jetstream, so
      # it is started as a step. The port matches the compose stack's default,
      # which is what the Makefile's test URL points at.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine --jetstream --http_port 8222
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8222/healthz >/dev/null; then echo "nats is up"; exit 0; fi
            sleep 1
          done
          echo "NATS did not become healthy" >&2; docker logs nats; exit 1

      - name: Create the platformkit_app role
        env:
          PGPASSWORD: platformkit
        run: psql -h localhost -U postgres -d platformkit -v ON_ERROR_STOP=1 -f deploy/postgres/init.sql

      # The ratchet only ever lowers a ceiling. `--write` cannot raise one, but
      # a hand edit can, so the raise is caught here rather than in review.
      # Skipped when there is no main to compare against, which is the first
      # commit and nothing else.
      - name: Budgets only ratchet down
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main 2>/dev/null || true
          if ! git cat-file -e origin/main:loc-budget.json 2>/dev/null; then
            echo "no base ref yet; skipping"
            exit 0
          fi
          raised=$(jq -rn \
            --argjson base "$(git show origin/main:loc-budget.json)" \
            --argjson head "$(cat loc-budget.json)" \
            '[$head.buckets[] as $h
              | ($base.buckets[] | select(.name == $h.name)) as $b
              | select($h.max > $b.max)
              | "loc-budget.json: \($h.name) raised from \($b.max) to \($h.max)"] | .[]')
          base_pkgs=$(git show origin/main:packages-budget.json | jq .packages)
          head_pkgs=$(jq .packages packages-budget.json)
          if [ "$head_pkgs" -gt "$base_pkgs" ]; then
            raised="$raised
          packages-budget.json: raised from $base_pkgs to $head_pkgs"
          fi
          if [ -n "$(printf '%s' "$raised" | tr -d '[:space:]')" ]; then
            echo "A ceiling went up. Raising one is an owner commit with a reason:" >&2
            echo "$raised" >&2
            exit 1
          fi
          echo "budgets did not go up"

      - name: make check
        run: make check

      # Gate 10. It runs after the other nine because it is the slowest and the
      # only one that needs a browser: a failure in gate 1 should not wait for a
      # download. The browser is chromium alone, because this is a gate and not
      # a compatibility matrix.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: make e2e
        run: make e2e
