name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# One run per branch. A superseded push has nothing left to prove.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Only on GitHub: Gitea reads this directory too and runs .gitea/workflows for itself.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    # Twenty, not ten. `make check` and `make e2e` together run a real Postgres,
    # a real NATS and a browser, and a run that is cancelled at the deadline is a
    # red tick that says nothing about the change.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: platformkit
          POSTGRES_DB: platformkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platformkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Every action is pinned by commit, with the version it was beside it. A
      # tag on somebody else's repository is a pointer they can move, and an
      # action that moves is arbitrary code in a job holding this repository's
      # token. release.yml pins the same way and RELEASE.md says so.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Service containers ignore /docker-entrypoint-initdb.d, so the role that
      # compose creates on first boot is created here by hand, from the same file.
      # Service containers cannot take a command, and NATS needs --jetstream, so
      # it is started as a step. The port matches the compose stack's default,
      # which is what the Makefile's test URL points at.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine --jetstream --http_port 8222
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8222/healthz >/dev/null; then echo "nats is up"; exit 0; fi
            sleep 1
          done
          echo "NATS did not become healthy" >&2; docker logs nats; exit 1

      - name: Create the platformkit_app role
        env:
          PGPASSWORD: platformkit
        run: psql -h localhost -U postgres -d platformkit -v ON_ERROR_STOP=1 -f apps/platformkit/postgres-init.sql

      # The S3-compatible object store modules/file's S3 adapter is tested against.
      # Its cases fail rather than skip without one, on this repository's own rule
      # for the NATS transport: a suite that quietly skips the store it ships proves
      # nothing. The consequence of that choice is a fixture here, because this job
      # stands up its own services rather than the compose stack the Makefile's
      # default endpoint belongs to. The image, the credentials and the port are
      # compose.yaml's s3 service, so the store CI tests is the store `make up`
      # starts; the healthcheck is its own probe — an anonymous bucket list is
      # refused by design (403), and the refusal is what says somebody is listening.
      - name: Start the object store
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=pkittest -e AWS_SECRET_ACCESS_KEY=pkittestsecret \
            chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d server -s3 -dir=/data
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8333/; then echo "s3 is up"; exit 0; fi
            sleep 1
          done
          echo "the object store did not become available" >&2; docker logs s3; exit 1

      - name: make check
        run: make check

      # The dependencies, against the Go vulnerability database. It is a step
      # rather than a gate in the Makefile because it needs the network and a
      # laptop with no network is a laptop that can still run `make check`; and
      # it is govulncheck rather than a scanner over the module graph because it
      # reports the vulnerabilities this binary actually reaches, so a finding
      # here is a finding somebody has to act on.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Gate 10. It runs after the other nine because it is the slowest and the
      # only one that needs a browser: a failure in gate 1 should not wait for a
      # download. The browser is chromium alone, because this is a gate and not
      # a compatibility matrix.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Gate 10, and the step whose deadline the serial job used to reach. See the
      # same split in .gitea/workflows/ci.yml, which is the workflow this repository
      # actually runs: it names the two measurements this mirror is shaped by.
      - name: make e2e
        run: make e2e

      # The editor build stays with the functional gates, as it does in the
      # workflow this repository runs: a build needs no job network, no service and
      # no Node, and splitting it from the steps that run the image it produces
      # would make one job's artifact another job's precondition.
      - name: Corrected editor image builds without publishing
        run: docker build -f tools/designexport/openpencil/Dockerfile -t platformkit-openpencil:check .

      # Last, and deliberately. A ceiling that rose is a decision for an owner
      # to review, not a reason to stop the job before it has said whether the
      # code works.
      - name: Budgets only ratchet down
        env:
          BUDGET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check_budget_ratchet.sh "$BUDGET_BASE"

  # The design tool's own gates, mirrored from .gitea/workflows/ci.yml, which this
  # repository's runner actually executes and whose comment carries the measured
  # reason for the seam. This file's own `check` job carries twenty minutes and
  # carried every gate: the Gitea run of the same tree took 43m16s of steps, so the
  # shape below is the only one under which this job could ever have finished.
  design:
    # Only on GitHub: Gitea reads this directory too and runs .gitea/workflows for itself.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every design test embeds a real Go program and builds it before observing
      # anything, so this job compiles against the pinned toolchain although it runs
      # no Go gate.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/designexport/openpencil/package-lock.json

      - name: Native design conformance
        working-directory: tools/designexport/openpencil
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm test

      - name: Native browser observations
        working-directory: tools/designexport/openpencil
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
