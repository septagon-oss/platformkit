# Copy to config.yaml (git-ignored) and edit. The defaults match `make up`.
# This is the whole configuration surface, and a key that nothing reads does not
# belong here.

server:
  # Address the HTTP server listens on.
  addr: ":8080"
  # Host the app believes it is reached at. Absolute URLs and cookie scope are
  # derived from it, and tenant subdomains are resolved against it. Its port, if
  # it names one, is the port a person types — so an installation published on a
  # port that is not the one addr listens on (docker run -p 38591:8080, a compose
  # ports: entry) names its public port here, and every emailed link carries it;
  # leave it off and a link falls back to the port a request arrived on, which is
  # the port behind the mapping, and nobody outside it can reach that.
  public_host: "platformkit.localhost:8080"
  # The host the installation itself is reached at: the only address that
  # serves the control plane (/ops and /api/v1/ops/…). It is a host and not a
  # tenant, and it is not public_host — one installation answers its customers
  # at their hosts and its own operators at this one.
  #
  # Leave it empty and the control plane mounts but answers 404 everywhere,
  # which the app logs once at boot. The development database has an operator
  # tenant at this host, so the tenant switcher answers here.
  installation_host: "platformkit.localhost:8080"
  # Serve /openapi.json, /openapi.yaml and /docs.
  #
  # They need no session and they list every route and every permission the
  # application has — including which routes are the operator's — so they are a
  # map worth having before an attack and worth withholding during one. This
  # file is the one a deployment starts from, so it says no: turning them on is
  # a line somebody writes on a development machine, and leaving them on is a
  # line somebody has to have written.
  #
  # The JSON Schema route stays either way, because response bodies link to it.
  docs: false
  # Optional immutable Storybook.js build for the operator tenant. Build it with
  # ui/storybook/README.md; customer catalogs are selected in Go composition.
  storybook_dir: ""
  # How long a client has to send a whole request. It is a key rather than a
  # constant because the one thing it has to accommodate is a deployment's own
  # files.max_bytes over somebody's connection: thirty seconds is right for a
  # laptop and wrong for a deployment that accepts a gigabyte. The header, write
  # and idle timeouts are constants; see kit/app.
  read_timeout: 30s

database:
  # The app connects as platformkit_app: no superuser, no BYPASSRLS, so tenant
  # row-level security applies to every query it makes. connect_timeout bounds
  # the dial: a database that accepts nothing has to fail rather than hold a
  # request open on the caller's patience.
  url: "postgres://platformkit_app:platformkit@localhost:5432/platformkit?sslmode=disable&connect_timeout=5"
  # Migrations connect as the owner, which holds the DDL rights.
  migrate_url: "postgres://postgres:platformkit@localhost:5432/platformkit?sslmode=disable&connect_timeout=5"

  # The role that may expire the audit trail and may not write it: SELECT and DELETE
  # on audit_events, SELECT and INSERT on audit_retention_marks, and never SUPERUSER
  # or BYPASSRLS, or kit/db refuses the connection. Empty means the trail never
  # expires, and the audit-retention job says so at its first tick rather than
  # deleting nothing. audit.retention_days below 365 is refused at boot.
  retain_url: ""

  # Per-process pool limits; omitted values retain 16 open, 4 idle, 30m.
  # Account for every replica. All app roles require at least two connections:
  # HTTP detached transactions and job advisory locks need a second connection.
  # max_open_conns: 16
  # max_idle_conns: 4
  # conn_max_lifetime: 30m

  # How long one migration may wait — each file, and each batch of a backfill,
  # which is the half that waits longest behind the rows the application is
  # holding. Omitted keeps the documented defaults: a
  # five second wait for a lock (a migration that cannot take the lock in that
  # time stops and says it is contended, and may be run again), and no bound on a
  # statement at all — a legitimate index build on a large table is the statement
  # a duration bound would kill. Set statement_timeout only where a bound on the
  # longest statement is worth refusing a real build for, and know what that
  # refusal costs: a nontransactional file (-- pkit: autocommit=true) is the one
  # file the lock budget does not cover, so this is the only bound its wait has,
  # and a build this stops is left INVALID — the retry the refusal asks for says
  # the file is applied and does not rebuild the index. kit/db/README.md carries
  # both halves.
  # lock_timeout: 5s
  # statement_timeout: 0

nats:
  # Empty preserves role defaults: all uses memory; worker uses JetStream.
  # Set jetstream to share events between replicas of role all. Explicit memory
  # is only valid for role all. The application supplies the constructor for
  # each name (app.Transports); an injected Go Transport takes precedence.
  transport: ""
  # Comma-separated endpoints. Use tls:// outside localhost with credentials.
  # URL credentials are refused: move them to username and the password env.
  # Use a separate broker account per application/database/environment.
  url: "nats://localhost:4222"
  username: ""
  # Supply PLATFORMKIT_NATS_PASSWORD instead of storing a secret here.
  password: ""
  # Optional PEM trust roots for tls://; empty uses system trust roots.
  ca_cert: ""

# Where a value that every replica must read is kept. An empty adapter is this
# process's own memory: a complete deployment for one process, which kit/app says
# once in a boot line, because forgetting a value there reaches only that process.
cache:
  # "" (the in-process store) | memory | valkey. The application supplies the
  # constructor for the shared name (app.Caches), as it does for each transport.
  adapter: ""
  # The first segment of every key this installation writes. Required with
  # valkey: two products behind one address have one keyspace.
  app: ""
  # redis://, rediss://, valkey:// or unix://, no path, no query. URL credentials
  # are refused: put the secret in PLATFORMKIT_CACHE_PASSWORD.
  url: ""
  password: ""
  # The store may never evict a key: the counter an invalidation raises has no TTL,
  # and an evicted one reads back as generation 0, which believes again what the
  # first invalidation closed. maxmemory-policy noeviction, or no maxmemory at all —
  # docs/cache.md, and the store `make up` starts.

log:
  # debug | info | warn | error
  level: "info"

# Where spans and numbers go. Every key is optional and the empty default exports
# nothing at all, which is a decision rather than an omission: a deployment that has
# chosen no backend pays nothing for traces nobody will read, and it still propagates
# the trace context it was handed and still leaves one on every outbox row it writes,
# so a trace continues into a process that does export. One TracerProvider and one
# MeterProvider live in kit/app; the vocabulary — the attribute keys and the three
# instruments — is kit/telemetry, which holds no provider and so never reaches a
# collector on its own. Traces are OTLP/gRPC, and the three numbers are
# pkit.http.operation.duration, pkit.outbox.lag and pkit.http.refusals by class.
telemetry:
  # The collector's gRPC endpoint: "collector.example:4317", or a host:port on a
  # network that needs no TLS. `make trace` starts one on localhost:4317 that prints
  # whatever arrives to its own container log. An unreachable collector is never a
  # failed boot: the
  # exporter buffers, warns through OpenTelemetry's own error handler and keeps
  # serving, and kit/health reports its last success as a reading an operator sees
  # and that never moves the verdict. PLATFORMKIT_TELEMETRY_OTLP_ENDPOINT.
  otlp_endpoint: ""
  # What the trace backend shows this process under. Every replica of one
  # deployment answers the same name; empty means "platformkit" rather than the
  # SDK's own "unknown_service:" plus the executable. PLATFORMKIT_TELEMETRY_SERVICE_NAME.
  service_name: ""
  # Names the client this installation serves, written on the resource of every
  # span and metric. Empty is right for a shared installation — one process serving
  # many tenants cannot name one client, which is the same reason the tenant is a
  # span attribute and never a resource one. PLATFORMKIT_TELEMETRY_CLIENT.
  client: ""
  # Fraction of the traces this process *starts* that are kept, 0 to 1. A trace that
  # arrives with a sampled parent stays kept whatever this says, so a worker handling
  # an event stays inside the request that caused it. Omitted keeps every new trace —
  # 0 is an answer and an omitted key is not, which is why it is commented rather than
  # written as an empty value. This key is read from the file alone: no environment
  # variable names it, because a sampling decision is reviewed with the file.
  # sample_ratio: 1.0

# The optional identity provider. An empty issuer — which is the default — means
# there is none, and the two OIDC routes are not registered at all: a route that
# would answer "this application has no identity provider" is a route with
# nothing to say. Passwords need no configuration; the argon2id parameters are
# constants in modules/user, because a deployment that lowers them has weakened
# itself and would have no reason to write it down.
#
# The client secret belongs in PLATFORMKIT_AUTH_OIDC_CLIENT_SECRET, not here:
# this file is the one somebody commits by accident.
auth:
  oidc:
    issuer: ""
    client_id: ""
    client_secret: ""
    redirect_path: "/api/v1/auth/oidc/callback"

  # The key that seals a second factor's shared secret at rest. Empty — the
  # default — offers no second factor at all: the enrolment routes are not
  # mounted, so signing in stays password-only rather than opening a door that
  # can only answer "unavailable". Set it in PLATFORMKIT_AUTH_FACTOR_KEY, never
  # here: an attacker with a database copy and this key holds working second
  # factors, and without it holds sealed bytes. Rotating it invalidates every
  # enrolled factor, which is a decision to make having withdrawn them.
  factor_key: ""

  # How many account requests — a sign-up, a verification resend, a forgotten-password
  # link — one address may make inside a window. It is a traffic figure, not a
  # strength: a development instance that signs people up all day names a large
  # quota, and production keeps the module's own. Omitted keeps 10 per 15m; an
  # explicit 0 is refused, never read as unlimited; the quota is at most 2147483646,
  # the most the counter can refuse past, and the window a Go duration of at most 24h.
  # This key is read from the file alone: no environment variable names it.
  # account_requests:
  #   quota: 10
  #   window: 15m

# The one outgoing mail server. An empty host — which is the default — means
# there is none: every notification is still recorded and the ones marked for
# email are logged rather than sent, which is what a machine with no relay wants
# and what a production one has to notice at boot. There is one sender and no
# provider abstraction; SMTP is what every service worth naming speaks.
#
# `make up` composes a catcher for a development machine to point this at: compose.yaml's
# mailpit service accepts on 1025 with no TLS and no credentials, and shows what it
# caught at http://localhost:8025 — which is where scripts/e2e.sh and the journeys that
# open a mailed link look. Put these three lines in config.yaml and a `make run` boot
# sends its mail where you can read it:
#
#   host: "localhost"
#   port: 1025
#   from: "PlatformKit <platformkit@localhost>"
#
# Nothing here holds the password. `kit/secrets` reads it as `mail.password` from
# whichever store the block below names — on a laptop, PLATFORMKIT_MAIL_PASSWORD, the
# variable this block's own `password:` line used to name. `username:` stays because a
# username is not a secret, so a relay that needs both is configured in two places.
#
# Where kit/secrets reads from. Empty adapter is the process's own environment, which
# is why a deployment that says nothing about secrets still has one. The token is the
# one secret that cannot arrive through the port, because the port needs it to read the
# port: secrets.url and secrets.token belong to secrets.adapter openbao, secrets.dir to
# file, and no secret belongs in this file.
#
#   secrets:
#     adapter: file
#     dir: /run/secrets/platformkit

# An empty host is not a sink and implies no stand-in for one. What a message
# with no server behind it becomes is the notification module's choice, made once
# per environment: a development deployment gets its in-process mailbox, so a
# sign-up is accepted and its confirmation link waits in that process to be read;
# anywhere else the installation composes the sender that refuses every send, the
# command that would promise a mailed link refuses with a reason, and a notice
# that asks for mail is recorded as suppressed. That is the difference between
# "this machine has no relay today" and "this installation accepted a sign-up
# whose confirmation nobody will ever receive".
mail:
  host: ""
  # Submission with STARTTLS, which is what a modern relay listens on.
  port: 587
  username: ""
  from: ""

# How long the audit trail is kept. It is the one thing modules/audit cannot
# decide for itself: a retention period is a compliance obligation, and a module
# that chose one would be choosing somebody else's. Zero means the default of a
# year; "keep it forever" is spelled with a large number.
audit:
  retention_days: 365

# The first administrator's password, read by `platformkit bootstrap` and by
# nothing else. Empty means the command generates one and prints it once. It
# belongs in PLATFORMKIT_BOOTSTRAP_PASSWORD, not here, for the same reason as
# the other secrets.
bootstrap:
  password: ""

# The password the demonstration people sign in with, read by the seed alone.
# Empty means this installation offers no demo sign-in: the demo people are still
# invited and given their roles, and the file's signIn record is neither asked for
# nor compared. The password itself belongs in no seed file — nothing under
# apps/platformkit/seed holds a secret, and the loader refuses a field named for
# one — and belongs here the way every other secret does: in
# PLATFORMKIT_DEMO_PASSWORD rather than in this file.
demo:
  password: ""

# Where uploaded bytes go, how large one upload may be, and how much disk one
# tenant may fill. They are the three things modules/file cannot decide for
# itself: a directory is a deployment's disk, and both limits are how much of it
# a deployment is willing to lose — to one mistake, and to one customer. The
# path is relative, so a laptop needs no absolute one and a container mounts a
# volume at it; an empty dir means data/files and a zero limit means 25 MB.
files:
  dir: "data/files"
  max_bytes: 26214400
  # The disk one tenant may hold, checked at upload against the sum of what
  # that tenant already has. Zero means a gigabyte; a negative number means no
  # quota at all, which is what a single-tenant installation wants and what a
  # deployment that lets anybody sign up must not have.
  quota_bytes: 1073741824
  # The largest frame an uploaded image is decoded into: a file whose header
  # claims more pixels is refused with the reason rather than allocated, which
  # is the decompression bomb. It bounds a decode and not an upload — max_bytes
  # is that — and zero means the module's own forty megapixels.
  max_image_pixels: 40000000
  # How long each retention class lives, keyed by the `kind` an upload carried.
  # A kind this table does not name is never deleted, only logged, so the empty
  # table below keeps everything and is the safe default for an example. A
  # duration is Go's own spelling — "8760h", not "365d" — and a class name is the
  # token the upload sent and not a word this repository invents: the application
  # that stores invoices under kind invoice is the one that says how long one
  # lives. An entry with no class name, or one that is not a positive duration,
  # fails the load rather than quietly deleting nothing.
  retention: {}
  # Which object store the bytes go to: empty or local-disk for the directory
  # above, s3 for the store below. A cloud profile writes this key for you; an
  # operator who writes it themselves keeps what they wrote, which is the whole
  # reason the setting exists beside the directory rather than instead of it.
  store: ""
  s3:
    # host:port, with no scheme, path or credentials in any of these: the scheme is
    # the key below and the credentials are the two keys after it, because a
    # credential pasted into an endpoint is one that ends up in a committed file.
    endpoint: ""
    bucket: ""
    region: ""
    # https unless a deployment writes http — the spelling a store inside a private
    # network needs, and one nobody reaches by leaving a key empty.
    scheme: "https"
    # How the bucket is addressed: auto asks the store, dns and path say which way
    # this network answers. Auto is right for the clouds and a coin flip for a
    # MinIO on a LAN, which is why the key exists.
    bucket_lookup: "auto"
    # The static pair the object-store client speaks. It has no credential chain, so
    # a cloud that expects the pod to know who it is still has to be given these two,
    # and an empty pair is not half a credential: it is an anonymous store.
    access_key: ""
    secret_key: ""

# The one setting that says which seams this deployment runs on: local (everywhere
# the default, and what an empty profile means), self-hosted, aws, gcp or azure. A
# profile writes the adapter each seam runs on — the object store, the shared cache,
# the event transport — and names what the deployment still has to provide for it:
# an address, a bucket, a sender. It writes no endpoint and no credential, infers
# nothing from a hostname, and dials nothing: choosing a profile is not a network
# call. Staging and production refuse a profile whose inputs nobody named; development
# warns, because a laptop halfway through a setup is a laptop and not an outage.
cloud:
  profile: ""

# Outbound webhooks: the HTTPS addresses a tenant registers so a machine of its own
# hears what happened here, signed with Standard Webhooks' own headers.
webhook:
  # The key that wraps the signing secret of every endpoint at rest. It is 32 bytes,
  # and the module refuses to be composed without one. This is the laptop's key, the
  # same kind of default as the database passwords above: a deployment that runs
  # anywhere but here replaces it with PLATFORMKIT_WEBHOOK_SECRET_KEY, and an
  # installation that rotates it cannot open the secrets wrapped with the old one, so
  # this is a value that outlives the file it was first written in.
  secret_key: "0123456789abcdef0123456789abcdef"
  # Loopback and private addresses to be dialled. Turn it on next to a receiver on
  # this machine; leave it off anywhere a tenant could name an address on the
  # deployment's own network. Neither setting opens the instance-metadata address.
  allow_local_endpoints: false
  # How long a finished attempt keeps the whole event it signed. Zero means the
  # module's own 90 days.
  retention_days: 0

# What this composition declares about itself, read at the migrating boot and put
# on that session for migrations/000042_tenant_app to place tenants with. The slug
# itself is nats.app, where kit/appname's grammar guards it and every shared name
# is already formed from it; what is here is the two facts a migration needs and
# the database cannot supply. Nothing at run time consults them.
#
# A fresh installation has nothing to place and needs neither key. An installation
# that already holds tenants and declares nothing gets a refusal listing every
# tenant by slug, which is the point: the alternative is one process's
# configuration deciding that every tenant in the database was its own.
app:
  # Every host this app serves its tenants at. An existing tenant joins this app
  # only when all of the hosts it holds are listed here; one host outside the list
  # is evidence the tenant belongs to another composition sharing the database.
  hosts: []
  # The operator's explicit placement, tenant slug to app slug, for the tenants no
  # host can place. Every value goes through the slug's grammar, and the mapping
  # has to cover every tenant left over or the migration refuses the run.
  tenant_apps: {}
  # The same placement as a file: one <tenant-slug>=<app-slug> line each, blank
  # lines and # comments allowed. It exists for a mapping too long to read in a
  # YAML blob, and is merged into the map above at load, the inline map winning a
  # disagreement. A line that is not a pair, a tenant mapped twice to two apps or
  # an app that is not a slug refuses the load; a slug naming a tenant that does
  # not exist yet does not, because the mapping may be describing the tenant the
  # operator is about to create.
  # tenant_apps_file: /etc/platformkit/tenant-apps.txt

# Feature flags, under `values:` because the block is a pointer to the map and an
# installation with no flags writes no `flags:` section at all. One boolean per
# key, read the way every other value here is read: through kit/config, with an
# environment override, and refused at load if
# the key is spelled wrong. A flag never grants a permission, narrows a tenant's
# scope or replaces a plan's entitlement (kit/flags/README.md); it switches an
# optional product behaviour on or off for this installation.
#
# change.control.site-settings is the one this application reads. Off, the site
# form writes the tenant's settings, which is what it has always done. On, that
# door answers 409 and names the proposal address instead: the write goes in as a
# proposal, and an account that did not put it forward applies it. The key is
# named in apps/platformkit/change.go, beside the consumer that reads it, and an
# absent key means off rather than whatever the loader's zero value happened to be.
flags:
  values:
    change.control.site-settings: false
