# Copy to config.yaml (git-ignored) and edit. The defaults match `make up`.
# This is the whole configuration surface, and a key that nothing reads does not
# belong here.

server:
  # Address the HTTP server listens on.
  addr: ":8080"
  # Host the app believes it is reached at. Absolute URLs and cookie scope are
  # derived from it, and tenant subdomains are resolved against it.
  public_host: "platformkit.localhost:8080"
  # Serve /openapi.json, /openapi.yaml and /docs. They need no session and they
  # list every route and permission the app has; on for a development machine,
  # a decision for anything public.
  docs: true

database:
  # The app connects as platformkit_app: no superuser, no BYPASSRLS, so tenant
  # row-level security applies to every query it makes. connect_timeout bounds
  # the dial: a database that accepts nothing has to fail rather than hold a
  # request open on the caller's patience.
  url: "postgres://platformkit_app:platformkit@localhost:5432/platformkit?sslmode=disable&connect_timeout=5"
  # Migrations connect as the owner, which holds the DDL rights.
  migrate_url: "postgres://postgres:platformkit@localhost:5432/platformkit?sslmode=disable&connect_timeout=5"

nats:
  # JetStream endpoint the outbox relay publishes module events to.
  url: "nats://localhost:4222"

log:
  # debug | info | warn | error
  level: "info"

# The optional identity provider. An empty issuer — which is the default — means
# there is none, and the two OIDC routes are not registered at all: a route that
# would answer "this application has no identity provider" is a route with
# nothing to say. Passwords need no configuration; the argon2id parameters are
# constants in modules/user, because a deployment that lowers them has weakened
# itself and would have no reason to write it down.
#
# The client secret belongs in PLATFORMKIT_AUTH_OIDC_CLIENT_SECRET, not here:
# this file is the one somebody commits by accident.
auth:
  oidc:
    issuer: ""
    client_id: ""
    client_secret: ""
    redirect_path: "/api/v1/auth/oidc/callback"
