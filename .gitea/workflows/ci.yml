# Verification only. The runner supplies a dedicated Docker daemon and a fresh
# job network; no workstation services or deployment credentials are required.
#
# How to read a red tick from this job. A job whose runner lost *this* job reports every step,
# `actions/checkout` included, as failure, and uploads no log at all, so whatever reads the verdict
# for a merge finds no failing line to quote. A job that fails a check written here reports the steps
# before the failure as success and leaves a log to read. 2026-10-02 measured the first shape three
# times in one day, each on runner `stitch-core`, each over fourteen to eighteen minutes: job 46966
# (run 46512) on one pull request, job 47128 (run 46674) on a push to main, job 47205 (run 46750) on
# another. That runner stayed online through all three — the journey job it took the same minute as
# the last of them (47206) has a log and per-step conclusions — so what was lost is that job's own
# execution and log upload, not the host. A head refused that way holds no line to fix: what answers
# it is a fresh run of the same head, and no edit to this repository does.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This self-hosted capacity accepts trusted same-repository changes only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-linux-amd64
    # 45 cut off runs 192, 193, 204, 210, 237 and 243 after every test that ran had passed: the job runs
    # make check, race, govulncheck, the design editor's browser verification and e2e in sequence. Task
    # T-0219 splits it across the two kernel runners; until then the limit leaves room.
    #
    # The split T-0219 asks for has begun below: two of the design tool's steps stand in a job of their
    # own there, and 45m09s of run 43926 (job 44369) reached the old ceiling 46 seconds into `make e2e` —
    # a step whose own measured cost on this runner is 103s, and whose whole chain came back green in
    # 43m16s at 0c3a040 (job 44137). What had spent the budget in front of those 103 seconds was that
    # same suite, which shares no database, no runtime and no binary with gate 10. The two raises are
    # independent: this number came from six runs that needed it, the job below keeps its own 45 because
    # its steps were measured at 16 minutes and nothing has cut it off. See that job for the seam.
    timeout-minutes: 75
    env:
      PLATFORMKIT_TEST_ADMIN_URL: postgres://postgres:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_DATABASE_URL: postgres://platformkit_app:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_NATS_URL: nats://nats:4222
      # The Valkey conformance suite runs here rather than skipping: the Makefile
      # points this variable at whatever `make up` publishes when a caller does not
      # set it, and the job sets it, so the one production adapter of kit/cache is
      # exercised by the gate that ships it and not only by hand.
      PLATFORMKIT_TEST_VALKEY_URL: redis://valkey:6379
      # The object store the S3 adapter's cases dial. They fail rather than skip
      # without one, as the NATS transport's do, so the fixture belongs here: this
      # job stands up its own services rather than the compose stack the Makefile's
      # localhost:8333 default belongs to.
      PLATFORMKIT_TEST_S3_ENDPOINT: s3:8333
      GOFLAGS: -p=4
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: platformkit
          POSTGRES_DB: platformkit
        options: >-
          --health-cmd "pg_isready -U postgres -d platformkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Full history, and this is the only job that owes it: the budget verdict at the foot of the job
      # walks `git rev-list $base..HEAD` over the commits that touched a ceiling
      # (scripts/check_budget_ratchet.sh:59), so a shallow fetch here would read that verdict green
      # across commits nobody fetched. `scripts/ci_checkout_history_test.sh` pins both halves — this
      # line stays deep while that walk exists, and no other job goes deep without one.
      #
      # This job therefore keeps the exposure the two above lose: its checkout was still fetching 49
      # minutes into run 49357, and its ceiling is 75. Bounding it from here would mean either a
      # shallow fetch (which takes the budget verdict's commits away) or a stall timeout (which turns
      # the wait into a faster red and nothing else). What answers it is outside this file: the forge's
      # git-http throughput under a contended queue, or T-0219's split of these steps across runners.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Stays false, and the two steps below are why: they own these same two paths, and one
          # path wants one owner. `cache: true` would add a second one — setup-go v7 restores and
          # saves GOMODCACHE/GOCACHE under a key of its own, `restoreCache(cachePaths, primaryKey)`
          # with no restore keys at all (dist/setup/index.js), so the same bytes would be uploaded
          # twice, warm forward under neither key, and the first commit after a go.sum change would
          # still download every module cold. Its key comes from `hashFiles` too, which on this
          # runner is a node process the runner spawns inside the job container and whose failure it
          # discards: with no `__OUTPUT__` guard in what comes back, `getHashFilesFunction` returns
          # "" and no error (act/runner/expression.go, act_runner v3.3.2) — and setup-go turns an
          # empty hash into `throw new Error('Some specified paths were not resolved, unable to
          # cache dependencies.')`, which reddens setup over a cache. The digest is taken in a shell
          # step below instead, where an empty answer is a visible thing and not a frozen key.
          cache: false

      # T-0277: this job compiled from nothing on every run. Both setup-go steps asked for no cache,
      # and the loop's own build cache is already shared, so CI is where a shared one pays. Measured in
      # this worktree on 2026-10-05 at the 4 CPU this job's GOFLAGS: -p=4 asks for, on a box at load 24:
      # `go build ./...` (= `make build`, check's first prerequisite) into an empty GOCACHE is 28.1s of
      # wall over 228.3s of CPU and leaves 781 MB behind; into a warm one, 2.9s over 4.7s. The race
      # build of every package is 56.8s over 227.1s cold and 3.3s over 4.9s warm, 848 MB more. Test
      # binaries and the module download are on top of that and unmeasured here, but the two steps
      # above are a gap of 25.2s + 53.5s ≈ 80s of this job's wall clock on their own.
      #
      # The key names what actually decides the bytes — the platform, the resolved toolchain, this
      # job's own name and a digest over both dependency files — with three prefix restore keys,
      # longest first, so a go.sum bump still warms the build from the archive the previous key wrote.
      # The recipe is one file, scripts/ci_go_cache_key.sh, called by both Go jobs with their own name:
      # one recipe, one key per job, because a key two jobs save under belongs to whichever of them
      # the store kept (see the file's own header). It asks `go env` where the caches live rather than
      # writing a path down, and it refuses by emitting no key and exiting 0, so a tree it cannot name
      # runs cold and green. A miss is a cold job either way: both steps below carry
      # continue-on-error, and neither asks for fail-on-cache-miss.
      #
      # Two limits of this shape, both accepted:
      #   - An exact hit never re-saves (the save below asks for `cache-hit != 'true'`), so a key's
      #     GOCACHE holds the first-party archives as they were when the key was first written and
      #     ages with the commits until go.sum, go.mod or the toolchain moves the digest; third-party
      #     modules and the packages that did not change stay warm the whole time. A time component in
      #     the key (an ISO week, say) would trade that archive's exact hit for a weekly re-save; the
      #     measurement the steps beside it are for is the first run of a new key against the second.
      #   - The two jobs share the *prefix*, not the archive, so the first run of a job's key after a
      #     dependency or toolchain change restores the other job's archive of the same toolchain —
      #     `check`'s is the ~1.3 GB raw the measurement above describes, and `design` reads a fraction
      #     of it — and pays that once per change before saving its own; every later run takes this
      #     job's own exact key. Whether that one restore costs more than it warms is readable in the
      #     step's `Cache Size:` and wall time.
      - name: Name this job's Go cache
        id: gocache
        run: bash scripts/ci_go_cache_key.sh check

      - name: Restore the Go module and build cache
        id: restore
        if: steps.gocache.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.gocache.outputs.key }}
          restore-keys: |
            ${{ steps.gocache.outputs.prefix-job }}
            ${{ steps.gocache.outputs.prefix-version }}
            ${{ steps.gocache.outputs.prefix-os }}
          path: |
            ${{ steps.gocache.outputs.modcache }}
            ${{ steps.gocache.outputs.gocache }}

      # Three things the operating system is asked for, one step, because a step that
      # installs one of them and not the other half of the question is what this line
      # is: `psql` answers the migration rehearsal, `ss` answers gate 10's question
      # "whose socket is this?", which scripts/free_port.sh refuses to answer from
      # itself, because a 200 on /health says something is listening and not that the
      # listener is mine, and PyYAML answers the three guards `make check` runs that read
      # a workflow as data instead of as text — scripts/mobile_journey_fetch_test.sh asks
      # which label the device journey runs on,
      # scripts/ci_go_cache_one_saver_per_key_test.sh asks whether one exact cache key has
      # more than one saving job, and scripts/ci_go_cache_job_archives_test.sh runs each
      # job's naming command and asks whether the archives it names are its own. A guard
      # that cannot parse its own subject is a red pull request no change in the tree
      # caused.
      #
      # The packages are not optional here, and the image does not provide them. This job's
      # image is pinned — gitea/runner-images:ubuntu-24.04@sha256:e77e2b1ebba51adb… is
      # the digest job 49823 of run 49357 names when it creates the container — and that
      # digest ships neither `ss` nor `lsof`. Measured 2026-10-04 by running this
      # repository inside it (`docker run -v $PWD:/w:ro -w /w … bash
      # scripts/free_port_test.sh`): the case stopped after four `ok` lines with exit 2,
      # at the first question about who holds a port. `make check` runs that file, and
      # `make check-e2e-guards` and `make e2e` both call scripts/e2e.sh, which asks the
      # same question of itself and refuses the run when the machine cannot answer — so
      # without this line three of this job's own steps are red for a reason no change
      # in the tree caused. The same run with iproute2 installed answered all sixteen
      # cases and exited 0. Case 6 of scripts/free_port_test.sh refuses a future edit
      # that takes the package back out, and says which steps would refuse to run.
      #
      # The third package is PyYAML, asked for on the same evidence and measured the same way.
      # `make check` runs scripts/mobile_journey_fetch_test.sh, which reads
      # .gitea/workflows/mobile.yml as YAML to ask which label the device journey runs on, to check
      # that no second job asks for it, and to take the fetch step out of the job as it is written
      # there. Running that file inside this same digest on 2026-10-05 (`docker run -v $PWD:/w:ro
      # -w /w … bash scripts/mobile_journey_fetch_test.sh`) died on its first question with
      # `ModuleNotFoundError: No module named 'yaml'` and exit 1; the same run with python3-yaml
      # installed answered `ok` and exited 0. With nothing pinning the package by name, its
      # refusal is a traceback rather than a sentence, which is why the line above is named in
      # the Makefile's comment over the goal that runs the case.
      #
      # The two guards T-0277 put in `make check` are missing from that digest the same way, and
      # this is the line that proves it rather than the reason it is written down. Measured
      # 2026-10-05 by the same kind of run, into the same image and the same repository mount:
      # python3 answers 3.12.3, `dpkg -l python3-yaml` answers `un` (not installed), `import yaml`
      # raises ModuleNotFoundError with exit 1, and
      # `bash scripts/ci_go_cache_one_saver_per_key_test.sh` — line 322 of the `check` goal at the
      # head CI refused, and the first line of it that asks for the module — died on that
      # traceback with that code. CI refused the head `5bf518b2` as
      # `make: *** [Makefile:322: check] Error 1` with every earlier step green and no
      # assertion in the log, which is what a missing parser looks like from the job page.
      # In the same container with python3-yaml installed beside the other two, the same
      # file printed `ok   each exact cache key in ci.yml has one saving job (2 key(s))`
      # and exited 0. Case 11 of scripts/ci_go_cache_test.sh is the matching refusal: it
      # asks the Makefile which goals it runs parse YAML and this job whether it installs
      # a reader before the step that runs them.
      - name: Install the database client, the socket probe and the YAML reader
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql-client iproute2 python3-yaml

      - name: Start NATS with JetStream on this job's network
        id: nats
        env:
          JOB_NETWORK: ${{ job.container.network }}
          # Each container this job starts by hand is named after the run that started it, from the same
          # run id the image tag below is built from. The cleanup step at the end of the job needs a
          # handle that outlives the step which made the container: a step the job's own deadline cuts off
          # never finishes writing $GITHUB_OUTPUT, so the id it recorded is lost, and a container still
          # running is what makes `docker image rm` refuse below and the job's network unremovable. The
          # run id is known to every step without any output, so a name is a handle the job cannot lose.
          CONTAINER_NAME: platformkit-${{ github.run_id }}-nats
        run: |
          test -n "$JOB_NETWORK"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          container=$(docker run -d --name "$CONTAINER_NAME" --network "$JOB_NETWORK" --network-alias nats \
            nats:2-alpine@sha256:ad7a43eb7e3337c3c38ce5d784d1461791f95f730f252d2b25eee699752a0ca3 \
            --jetstream --http_port 8222)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -fsS http://nats:8222/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      # The S3-compatible object store modules/file's S3 adapter is tested against,
      # on this job's network under the name the endpoint above names. Image,
      # credentials and port are compose.yaml's s3 service, so the store this job
      # tests is the store `make up` starts. The probe is that service's own
      # healthcheck: an anonymous bucket list is refused by design (403), and the
      # refusal is what says somebody is listening.
      - name: Start the object store
        id: s3
        env:
          JOB_NETWORK: ${{ job.container.network }}
        run: |
          test -n "$JOB_NETWORK"
          container=$(docker run -d --network "$JOB_NETWORK" --network-alias s3 \
            -e AWS_ACCESS_KEY_ID=pkittest -e AWS_SECRET_ACCESS_KEY=pkittestsecret \
            chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d server -s3 -dir=/data)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://s3:8333/; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      # The development mail catcher, on this job's network under the name the e2e
      # step's environment names. compose.yaml's mailpit service is the same image
      # and the same ports: the journeys that open a mailed link read it from here,
      # so the mail path they exercise — SMTP out of the application, the link back
      # into a browser — is the one a developer gets from `make up`, not a stand-in
      # the job invented. Started by hand for the same reason as NATS: this job
      # stands up its own services rather than the compose stack whose localhost
      # defaults belong to a workstation.
      - name: Start the mail catcher
        id: mailpit
        env:
          JOB_NETWORK: ${{ job.container.network }}
          CONTAINER_NAME: platformkit-${{ github.run_id }}-mailpit
        run: |
          test -n "$JOB_NETWORK"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          container=$(docker run -d --name "$CONTAINER_NAME" --network "$JOB_NETWORK" --network-alias mailpit \
            axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -fsS http://mailpit:8025/api/v1/info >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Create the platformkit_app role
        env:
          PGPASSWORD: platformkit
        run: psql -h postgres -U postgres -d platformkit -v ON_ERROR_STOP=1 -f apps/platformkit/postgres-init.sql

      # noeviction, as compose.yaml names it: the generation counter a Move raises is
      # written with no TTL, and a store that evicts it reads back as generation 0,
      # which believes again the entries the first Move closed. docs/cache.md.
      - name: Start Valkey on this job's network
        id: valkey
        env:
          JOB_NETWORK: ${{ job.container.network }}
          CONTAINER_NAME: platformkit-${{ github.run_id }}-valkey
        run: |
          test -n "$JOB_NETWORK"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          container=$(docker run -d --name "$CONTAINER_NAME" --network "$JOB_NETWORK" --network-alias valkey \
            valkey/valkey@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507 \
            --maxmemory-policy noeviction)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if docker exec "$container" valkey-cli ping 2>/dev/null | grep -q PONG; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      # Two questions no other step here answers, and both were steps nobody was
      # forced to run: what this release's migrations cost against a copy of the
      # database an installation actually has (ADR 0011), and which exported name
      # a pinned consumer compiled against the last release. `make check` now
      # depends on both; they are separate steps so a contributor sees which of
      # the two broke rather than reading it out of a make line. The rehearsal
      # writes a receipt on the path where it is true, and it is printed here
      # because every action in this repository is pinned by commit and an
      # upload action would need a pin nobody has verified — the job log carries
      # it, the way .gitea/workflows/public-consumption.yml carries its reports.
      # A consumer's own CI refuses a pin that cannot name one
      # (scripts/PIN-REHEARSAL.md).
      - name: Migration rehearsal (make check-rehearse)
        env:
          REHEARSE_RECEIPT: ${{ runner.temp }}/rehearsal.json
        run: |
          make check-rehearse
          cat "$REHEARSE_RECEIPT"

      - name: Exported surface against the supported tag (make check-apidiff)
        run: make check-apidiff

      - name: make check
        run: make check

      # Second, and load-bearing: the outbox, the request transaction, the advisory
      # locks over a tenant's administration, the limit counters and the router under
      # the race detector. The Makefile target has existed since the concurrency
      # kernel and CONTRIBUTING has said CI runs it, but no workflow ever called it —
      # so the one gate that would notice a lock released before the commit that needs
      # it has only ever run in a contributor's shell. It stays a separate step from
      # `make check` because -race roughly doubles the suite; the packages it covers
      # are the Makefile's standing RACE_PACKAGES list, widened by the commit that put
      # advisory locks in modules/auth and modules/user.
      - name: make check-race
        run: make check-race

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Ahead of every step that brings in node and Chromium, behind every step that compiles. Two
      # measurements set this position, and the first version of it got both backwards.
      #
      # What a step of this job is worth depends on the minutes it covers. `make check` ran 22:48:52 →
      # 22:59:12, `make check-race` to 23:08:45 and govulncheck to 23:09:12 (run 50923, job 51417) —
      # every package, every test binary and the -race build are compiled by here — and behind this
      # line the job asks the compiler for almost nothing: `make check`'s own `build:` goal already
      # compiled ./..., which includes apps/platformkit and tools/designexport, so gate 10's
      # `go build -o … ./apps/platformkit` (scripts/e2e.sh:137) and the editor suite's three
      # `go run ./tools/designexport` (editor/replacement.test.mjs:1696, 1790, 2013) take from a cache
      # holding only that build goal 2.89s and 0.49s — the two final links — measured here at -p=4
      # against a GOCACHE seeded by `go build -buildvcs=false -o /dev/null ./...`, which took 37.94s,
      # and 28.73s and 2.85s against an empty one. So the position costs this job 3.4s of compile, and
      # what it decides is whether the next run finds this archive at all — the ~80s of wall clock the
      # measurement above this job's own naming step says its two cold builds owe to it.
      #
      # And position decides whether the step happens at all. That same job lost its runner with this
      # step still in front of it: the last byte of its log is the Chromium suite's sampler at 23:17:11,
      # `completed_at` is 23:31:36, and the fourteen minutes twenty-five seconds between them are why
      # the forge reported this step — and every other step it had not reached — as failure with no
      # line of it executed. See this file's header. A save that stands behind ~24 minutes of browser
      # work (this file's own figure for the editor step alone is 15m24s serial) is a save that may
      # never run, and the `design` job's copy of this step, twelve steps earlier in the same run,
      # wrote its archive in 9 seconds. The archive is worth nothing to the next run if the run that
      # writes it is lost on the way to it. scripts/ci_go_cache_test.sh case 12 refuses a save that
      # moves back behind node.
      #
      # The guards on the step itself are unchanged and still why they are what they are. `success()`
      # keeps a job that already failed from spending its remaining minutes uploading;
      # `cache-hit != 'true'` because an exact hit means the archive under this key is already the one
      # this job just used, and on a miss `restore` leaves `cache-hit` unset rather than false
      # (src/restoreImpl.ts, actions/cache v6.1.0), which is why the test reads `!= 'true'`;
      # `continue-on-error` answers the one shape of failure that would otherwise reach the job — the
      # library downgrades an unreachable or refused cache server to a warning, but restoreImpl still
      # calls `core.setFailed` on a thrown error and saveImpl warns and exits 0, so the flag is
      # written as the property, not because the library is trusted.
      #
      # What it costs, measured here rather than assumed: GOMODCACHE (496 MB, the whole build list)
      # plus the 781 MB of GOCACHE that `go build ./...` alone leaves behind is 1.3 GB raw, 400 MB
      # gzipped, 56 s of single-threaded gzip. This job's archive is larger than that — the -race
      # build and every test binary are in it — so if this step's own log reports `Cache Size:` above
      # about 2 GiB, the narrowing is `path:` GOMODCACHE only, same keys: a build cache that costs
      # more to ship than to recompile is not a cache, and the module download is the dearer byte on a
      # runner. The 117 MB `design` reports for the same two paths is a floor for that number, not the
      # number.
      - name: Save the Go module and build cache
        if: success() && steps.gocache.outputs.key != '' && steps.restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.gocache.outputs.key }}
          path: |
            ${{ steps.gocache.outputs.modcache }}
            ${{ steps.gocache.outputs.gocache }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ''
          package-manager-cache: false

      # Gate 10's browser: chromium alone, because this is a gate and not a
      # compatibility matrix. The design tool installs its own pinned Playwright in
      # its own job, so nothing here is waiting for a download it does not use.
      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Gate 10, and the step the deadline of run 43926 killed 46 seconds into. It
      # costs 103s on this runner (job 44137) and 176s on a development box, and it
      # used to stand last behind every other gate, which is why the failure that
      # named it said nothing about it. It now follows the Go gates and its own
      # browser, and the budget verdict still runs after it.
      # Gate 10's two refusals to drive an application it did not start, before the gate they guard.
      # They stand here rather than in the `make check` step above for one measured reason: each one
      # starts scripts/e2e.sh, which stops at its own node check before it prints anything either case
      # greps for, and node appears two steps after `make check`. Here node, the browser, python3 (the
      # decoy listener; `make check`'s own check-apidiff step proves it on this runner) and Postgres all
      # exist. 17s for both on a development box, 2026-10-04; the mid-build case waits on gate 10's own
      # log and so costs its build when the cure is intact and its whole run when it is not.
      - name: Gate 10's port refusals (make check-e2e-guards)
        # The same catcher, under the same names, as the step below. The mid-build
        # case starts scripts/e2e.sh and waits for it to reach its database, and
        # scripts/e2e.sh refuses a run with nothing answering the catcher before it
        # creates anything — so a guards run that names no catcher would be refused
        # for the mail, never reach the port, and the case would report its own
        # premise missing rather than the refusal it is looking for.
        env:
          PLATFORMKIT_E2E_MAIL_HOST: mailpit
          PLATFORMKIT_E2E_MAIL_PORT: '1025'
          PLATFORMKIT_E2E_MAILPIT_URL: http://mailpit:8025
        run: make check-e2e-guards

      - name: make e2e
        # The catcher this job started earlier, under the alias its network gives it
        # (`Start the mail catcher`, beside the object store). scripts/e2e.sh refuses
        # to boot the application without one, and a localhost default is not
        # reachable from a job that runs its services by service name.
        env:
          PLATFORMKIT_E2E_MAIL_HOST: mailpit
          PLATFORMKIT_E2E_MAIL_PORT: '1025'
          PLATFORMKIT_E2E_MAILPIT_URL: http://mailpit:8025
        run: make e2e

      # The editor images are built and driven here rather than in `design` for one
      # reason: this block runs its containers on `${{ job.container.network }}`, and
      # this is the job whose container provably has one.
      #
      # And the driver needs this install. The two verify steps below run Node in
      # tools/designexport/openpencil, and every module they load comes from that
      # directory's node_modules: register.mjs throws unless @open-pencil/core, /fig
      # and /scene-graph resolve at the pinned version; all five test files under
      # editor/ and preview/ import playwright and @open-pencil/scene-graph, several
      # more reach for @open-pencil/core/canvas, core/layout and the core fig and
      # raster format modules; editor/replacement.test.mjs imports opentype.js and
      # axe-core; and the preview files, through browser/fixtures.test.mjs, read woff
      # bytes out of the devDependency @fontsource/ibm-plex-sans — which is why the
      # install is plain `npm ci` and not `--omit=dev`. Moving the design suites
      # to the job at the foot of this file moved the `npm ci` that produced those
      # modules with them and left these two steps without them: at 8045158a the
      # first node command died on `Cannot find module '@open-pencil/core'` raised at
      # register.mjs:8, before it had asked the container for anything, and CI
      # refused the head on that step's exit 1. These are the same two lines the
      # pre-split `check` job ran in this directory, inside the two steps the split
      # moved (40s and 884s of the run 43926 deadline, measured at that run); what
      # stays in `design` is the suites, not what the steps here need in order to run
      # at all. Before the image builds,
      # so a broken install costs no build time; with --with-deps, as it ran before
      # the split, because e2e/ pins @playwright/test ^1.63 and this job pins
      # playwright 1.62.1 — two pins, two chromium builds, one shared cache, and
      # e2e/'s step cannot fetch what this one names (measured locally: 1.62.1 starts
      # chromium-1234, 1.63.0 its own chromium-1243).
      - name: Install the editor tests' dependencies
        working-directory: tools/designexport/openpencil
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Corrected editor image builds without publishing
        env:
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
        run: |
          docker build -f tools/designexport/openpencil/Dockerfile -t "$IMAGE" .
          docker build --target preview -f tools/designexport/openpencil/Dockerfile -t "$IMAGE-preview" .
          docker build --target complete-preview -f tools/designexport/openpencil/Dockerfile -t "$IMAGE-complete-preview" .

      - name: Verify editing and downloaded FIG saves in the built editor
        id: editor
        working-directory: tools/designexport/openpencil
        env:
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
          JOB_NETWORK: ${{ job.container.network }}
          PLATFORMKIT_OPENPENCIL_URL: http://openpencil:8080
          CONTAINER_NAME: platformkit-${{ github.run_id }}-editor
        run: |
          test -n "$JOB_NETWORK"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          container=$(docker run -d --name "$CONTAINER_NAME" --network "$JOB_NETWORK" --network-alias openpencil \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 \
            --tmpfs /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101 \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 "$IMAGE")
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null
          # One editor suite at a time. Each file under editor/ launches its own Chromium, and
          # node's default test concurrency is one file per core, so this step handed the runner
          # three browsers at the moment its Go suites had just stopped asking for memory. What
          # comes back from that is not an assertion: the browser dies and the case reports
          # `locator.click: Target crashed` against a five-second wait. The step has refused two
          # of main's own pushes that way (`e32fb81a`, `063b6535`, job logs read by task T-0110
          # round 26). Root reports it refused this branch's head `2be69fa1` too; that run's log
          # was unreadable from here — the forge API answers 403 to an unauthenticated checkout.
          # The directory already states the bound for its other browser suite —
          # `npm run test:browser` passes `--test-concurrency=2` — and this is the step that
          # never named one.
          # Measured here at this head against this image and the step's own docker flags, on a
          # box at load 18-31 with 38 GB free: unbound, 31 tests in 413.2 s of wall over 475.6 s
          # of test time (ratio 1.15, so at least two files overlap); bound, 31 tests in 441.3 s
          # over 438.6 s (ratio 0.99, and the process tree held one Chromium). Both forms pass
          # all 31 here; only the bound form cannot starve a neighbour. The cost is the overlap:
          # T-0110 round 26 put the same step at 12m49s unbound on CI's runner against about
          # 15m24s serial, inside the job's 45 minutes. No assertion, skip, retry or reordering.
          # The sampler below is this branch's own addition: a Chromium that crashes leaves
          # the log with no way to tell starvation from a broken build, and /proc/meminfo in
          # a job container is the host's, which is the number the next refusal will need.
          ( while :; do
              awk '/MemAvailable/{printf "runner MemAvailable %d MB\n", $2/1024}' /proc/meminfo
              cut -d' ' -f1-3 /proc/loadavg | sed 's/^/runner load average /'
              sleep 30
            done ) & sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          node --import ./register.mjs --test --test-concurrency=1 editor/*.test.mjs

      - name: Verify both font profiles and visible editable preview text
        id: preview
        working-directory: tools/designexport/openpencil
        env:
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
          JOB_NETWORK: ${{ job.container.network }}
          CONTAINER_NAME: platformkit-${{ github.run_id }}
        run: |
          test -n "$JOB_NETWORK"
          for profile in latin complete; do
            case "$profile" in
              latin) target=preview; test_file=fonts.test.mjs ;;
              complete) target=complete-preview; test_file=complete-fonts.test.mjs ;;
            esac
            export PLATFORMKIT_OPENPENCIL_URL="http://openpencil-$target:8080"
            docker rm -f "$CONTAINER_NAME-$profile" >/dev/null 2>&1 || true
            container=$(docker run -d --name "$CONTAINER_NAME-$profile" --network "$JOB_NETWORK" --network-alias "openpencil-$target" \
              --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 \
              --tmpfs /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101 \
              --tmpfs /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 "$IMAGE-$target")
            echo "$profile=$container" >> "$GITHUB_OUTPUT"
            for i in $(seq 1 30); do
              if curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null
            node --import ./register.mjs --test "preview/$test_file"
          done

      # Last, and deliberately. A ceiling that rose is a decision for an owner
      # to review, not a reason to stop the job before it has said whether the
      # code works. The cleanup below still runs, because it runs always().
      - name: Budgets only ratchet down
        env:
          BUDGET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check_budget_ratchet.sh "$BUDGET_BASE"

      - name: Remove this job's manually created resources
        if: always()
        env:
          NATS_CONTAINER: ${{ steps.nats.outputs.container }}
          VALKEY_CONTAINER: ${{ steps.valkey.outputs.container }}
          MAILPIT_CONTAINER: ${{ steps.mailpit.outputs.container }}
          EDITOR_CONTAINER: ${{ steps.editor.outputs.container }}
          PREVIEW_CONTAINER: ${{ steps.preview.outputs.latin }}
          COMPLETE_PREVIEW_CONTAINER: ${{ steps.preview.outputs.complete }}
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
          NATS_NAME: platformkit-${{ github.run_id }}-nats
          VALKEY_NAME: platformkit-${{ github.run_id }}-valkey
          MAILPIT_NAME: platformkit-${{ github.run_id }}-mailpit
          EDITOR_NAME: platformkit-${{ github.run_id }}-editor
          PREVIEW_NAME: platformkit-${{ github.run_id }}
        run: |
          status=0
          # Each container is dropped by the id its own step recorded, when that step finished, and by the
          # run's name always. Both handles reach the same container, and the name is the one a step cut
          # off mid-flight still leaves behind: run 245 lost the editor's id that way and its container
          # held the run's image against the three removals below, which are deliberately not forced.
          # A handle that names nothing is not a failure — the step that would have made that container
          # may never have run.
          drop() {
            for handle in "$@"; do
              [ -n "$handle" ] || continue
              docker inspect "$handle" >/dev/null 2>&1 || continue
              docker rm -f "$handle" || status=1
            done
          }
          drop "$NATS_CONTAINER" "$NATS_NAME"
          drop "$VALKEY_CONTAINER" "$VALKEY_NAME"
          drop "$MAILPIT_CONTAINER" "$MAILPIT_NAME"
          drop "$EDITOR_CONTAINER" "$EDITOR_NAME"
          drop "$PREVIEW_CONTAINER" "$PREVIEW_NAME-latin"
          drop "$COMPLETE_PREVIEW_CONTAINER" "$PREVIEW_NAME-complete"
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then docker image rm "$IMAGE" || status=1; fi
          if docker image inspect "$IMAGE-preview" >/dev/null 2>&1; then docker image rm "$IMAGE-preview" || status=1; fi
          if docker image inspect "$IMAGE-complete-preview" >/dev/null 2>&1; then docker image rm "$IMAGE-complete-preview" || status=1; fi
          exit "$status"

  # The design tool's own gates, in a job of their own.
  #
  # A deadline belongs to a job, and one job used to carry every gate in this
  # repository one after another. Run 43926 reached 45m09s of that with `make check`
  # and `make check-race` 168s slower than the same steps at 0c3a040 (449s/314s
  # against 345s/250s) — the suite grows with every review round, and this runner's
  # pace varies by more than that between a quiet box and a busy one — and the
  # deadline then expired inside `make e2e`. The two steps that had already spent
  # 924 of those seconds (40s and 884s, in that same run) observe the design tool in
  # Chromium and build the Go programs its tests embed: no service, no database, no
  # port, no application binary. Moving only those is the whole change; the
  # editor-image steps stay in `check` because they run containers on
  # `${{ job.container.network }}`, and whether a job with no service containers is
  # given one is a question the forge answers and this repository cannot — the
  # runner guide states the context exists, not when it is populated. Measured at
  # 0c3a040's pace, `check` is now 28 minutes of steps (31 at the refused head's)
  # and this job 16. Each carries its own ceiling: this job keeps the 45 it was written against, and
  # `check` above carries the 75 main gave it for the runs 45 cut off there.
  design:
    # The same trusted-repository rule as `check`: same forge, same self-hosted
    # capacity, same token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-linux-amd64
    timeout-minutes: 45
    steps:
      # One commit, because nothing in this job reads another. `fetch-depth: 0` asks for every branch
      # and every tag — at the time of writing 128 heads and 199 tags, the `v1.1.2-proof.*` tag every
      # delivery pushes among them — in a single fetch that carries no deadline of its own. At
      # b6f1e93 that fetch was still running when this job's 45 minutes expired: the job log writes
      # `##[error]context deadline exceeded` at 22:15:51 inside `Fetching the repository`, and the
      # forge reported the job's only failed step as `Run actions/checkout@…`, which is the line that
      # refused the head while every real step of the job was reported skipped. The same action
      # fetched the single ref its post step needed in 26 seconds in that same log. What the fetch was
      # bought for is nothing: `grep -rnwi --exclude-dir=node_modules git tools/designexport/openpencil`
      # answers 0 lines, so its four steps (npm ci, npm audit, `npm test`, which builds a Go program
      # per test, and the browser observations) read no git object. Verified locally in a `--depth=1
      # --single-branch` clone of the same head: 586 native design tests, 0 failures.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # Every design test embeds a real Go program and builds it before observing
      # anything — which is why the Makefile's own check-fixtures target exists — so
      # this job compiles against the pinned toolchain even though it runs no Go gate.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Stays false for the reason written out beside the same input in `check`: the restore and
          # save steps below own these two paths, and setup-go v7's own cache has no restore keys.
          cache: false

      # This job compiles too — every design test builds a real Go program before observing it
      # (fixtures-compile.test.mjs, and browser/fixtures.test.mjs line 28 runs `go build`) — so it calls
      # the same recipe `check` calls, with its own name: the two jobs form two keys, each saving the
      # archive its own build wrote, because a key both of them saved under would belong to whichever
      # one the cache store kept and leave the other restoring bytes that are mostly not its own, cold
      # and green, until go.sum moved. What they share is the key's prefix, so `design`'s first run of a
      # new digest still warms from `check`'s archive before it has one of its own. The two trees are
      # not the same bytes — `go list -deps -test` over this tree answers 859 third-party packages over
      # 131 modules for what `check` builds and 41 over 8 for this job's target — so one archive could
      # never warm both. scripts/ci_go_cache_test.sh refuses either job forming a key of its own, and
      # scripts/ci_go_cache_one_saver_per_key_test.sh refuses the one key this used to have.
      - name: Name this job's Go cache
        id: gocache
        run: bash scripts/ci_go_cache_key.sh design

      - name: Restore the Go module and build cache
        id: restore
        if: steps.gocache.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.gocache.outputs.key }}
          restore-keys: |
            ${{ steps.gocache.outputs.prefix-job }}
            ${{ steps.gocache.outputs.prefix-version }}
            ${{ steps.gocache.outputs.prefix-os }}
          path: |
            ${{ steps.gocache.outputs.modcache }}
            ${{ steps.gocache.outputs.gocache }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ''
          package-manager-cache: false

      - name: Native design conformance and dependency audit
        working-directory: tools/designexport/openpencil
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm test

      # Its own Playwright and its own chromium: the tooling pins a different build
      # from e2e/'s, and `--with-deps` runs apt itself (measured: it fetches its own
      # package lists), so this job needs no database-client step to reach them.
      - name: Native browser observations
        working-directory: tools/designexport/openpencil
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      # Last, and for the same reason as the step of the same name in `check` — this suite compiles
      # Go itself (browser/fixtures.test.mjs: `go build -o <executable> <file>`), so the save that
      # covers this job's own binaries has to sit behind it. Guarded the same way: a cache the runner
      # cannot reach is a cold job, never a red tick.
      - name: Save the Go module and build cache
        if: success() && steps.gocache.outputs.key != '' && steps.restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.gocache.outputs.key }}
          path: |
            ${{ steps.gocache.outputs.modcache }}
            ${{ steps.gocache.outputs.gocache }}
