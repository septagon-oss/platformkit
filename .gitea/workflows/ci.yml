# Verification only. The runner supplies a dedicated Docker daemon and a fresh
# job network; no workstation services or deployment credentials are required.
#
# Four jobs, not one. The single `check` job ran make check, race, govulncheck,
# the design suite, its browser verification and e2e back to back under one limit;
# at 45 minutes that cut off runs 192, 193, 204, 210, 237, 243, 245 and 257 with
# every test that had run passed (task T-0219 read each of those logs: no
# `--- FAIL:` line anywhere, `context deadline exceeded` on the step in flight).
# Raising the limit to 75 was a retry in another form. Split, the work is four
# independent jobs that the two kernel runners — `stitch-core` and
# `stitch-core-2` — take at once, each bounded at twice a span it has measured
# rather than at whatever the longest neighbour needed. Where a job has completed a
# run of its own — `go-checks`, `race-and-vuln` and `e2e` at run 307, whose id is
# 46460, the name the forge's API answers — that run prices it, because below twenty
# runs a job's empirical p95 *is* its slowest run, and a step span read out of main's
# merged job never carried the checkout, the fixture or the store the split gave each
# job of its own. `scripts/ci_job_limits_cover_their_measured_runs_test.py` refuses a
# limit under twice the slowest completed run the forge recorded for that job.
# `design-editor` has completed no run of its own, and its arithmetic is still the 13
# `ci.yml` runs on main at number ≥ 180, step spans read from each step's own
# `::group::` marker.
#
# The fixture the jobs share — the database client, the broker, the app role — is one
# script, `scripts/ci_setup.sh`, which each job calls with the units its suite dials.
# A fixture written four times is a fixture that drifts. Postgres itself stays a per-job
# `services:` block, because that is the shape the runner probes and owns (mobile.yml has
# used it since its first green run), and the object store stays with the one job that
# runs `make check`; scripts/ci_setup_test.sh refuses a job that calls the script without
# a database of its own.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # go-checks is the whole `make check`: build, vet, fmt, the budget and tenancy
  # greps, the architecture rehearsals and every Go test in the tree — so this is
  # the job that owes the object store, because modules/file's S3 adapter's cases
  # fail rather than skip without one.
  go-checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-linux-amd64
    # 2 × this job's own measured p95. It has had one run: job 46910 of run 307
    # (id 46460, at 35fe554c), 05:12:12Z → 05:21:37Z = 565s, so 1130s, and minutes
    # round up — 19 minutes, 1140s. The first price, 18, was main's step spans: `make check`
    # p95 464s over 13 runs (min 323, p50 372, max 526), the ratchet 0.3s, setup
    # and checkout about 55s — 1040s. That first run of the job itself ran past
    # main's *maximum* of 526s, which is what the pin named above now refuses. The
    # ceiling catches a job that lost a server, not one that is merely slow: at 45
    # minutes the same work had already been cut off eight times on main.
    timeout-minutes: 19
    env:
      PLATFORMKIT_TEST_ADMIN_URL: postgres://postgres:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_DATABASE_URL: postgres://platformkit_app:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_NATS_URL: nats://nats:4222
      # The Valkey conformance suite runs here rather than skipping: the Makefile
      # points this variable at whatever `make up` publishes when a caller does not
      # set it, and the job sets it, so the one production adapter of kit/cache is
      # exercised by the gate that ships it and not only by hand.
      PLATFORMKIT_TEST_VALKEY_URL: redis://valkey:6379
      # The object store the suite the S3 adapter's cases dial. It is this job's own concern
      # because it is the only job that runs them; the step below starts the store
      # under this alias, and modules/file's workflow_store_fixture_test reads both
      # halves of that arrangement out of this file.
      PLATFORMKIT_TEST_S3_ENDPOINT: s3:8333
      GOFLAGS: -p=4
    services:
      # The database is the runner's own service, in this shape and no other: the
      # runner brings it up, probes it, and puts it on the network every step of this
      # job shares — which is what the `postgres:` host in the URLs above means. It is
      # written per job because a service map cannot be shared without a composite
      # action these runners' support for is not something a checkout can check; what
      # is shared is the rest of the fixture (scripts/ci_setup.sh), and
      # scripts/ci_setup_test.sh refuses a job that calls that script without a
      # database of its own to point at.
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: platformkit
          POSTGRES_DB: platformkit
        options: >-
          --health-cmd "pg_isready -U postgres -d platformkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Start the message bus and the application role
        id: setup
        env:
          JOB_NETWORK: ${{ job.container.network }}
          NATS_CONTAINER_NAME: platformkit-${{ github.run_id }}-go-checks-nats
        run: bash scripts/ci_setup.sh nats app-role

      # The S3-compatible object store modules/file's S3 adapter is tested against,
      # on this job's network under the name the endpoint above names. Image,
      # credentials and port are compose.yaml's own s3 service, so the store this
      # job tests is the store `make up` starts. The probe is that service's own
      # healthcheck: an anonymous bucket list is refused by design (403), and the
      # refusal is what says somebody is listening.
      - name: Start the object store
        id: s3
        env:
          JOB_NETWORK: ${{ job.container.network }}
          CONTAINER_NAME: platformkit-${{ github.run_id }}-go-checks-s3
        run: |
          test -n "$JOB_NETWORK"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          container=$(docker run -d --name "$CONTAINER_NAME" --network "$JOB_NETWORK" --network-alias s3 \
            -e AWS_ACCESS_KEY_ID=pkittest -e AWS_SECRET_ACCESS_KEY=pkittestsecret \
            chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d server -s3 -dir=/data)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://s3:8333/; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      # noeviction, as compose.yaml names it: the generation counter a Move raises is
      # written with no TTL, and a store that evicts it reads back as generation 0,
      # which believes again the entries the first Move closed. docs/cache.md. In
      # this job because this is the job that runs `make check`, whose Valkey
      # conformance case fails rather than skips once PLATFORMKIT_TEST_VALKEY_URL is
      # set — an address a job sets for itself is a promise.
      - name: Start Valkey on this job's network
        id: valkey
        env:
          JOB_NETWORK: ${{ job.container.network }}
          CONTAINER_NAME: platformkit-${{ github.run_id }}-go-checks-valkey
        run: |
          test -n "$JOB_NETWORK"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          container=$(docker run -d --name "$CONTAINER_NAME" --network "$JOB_NETWORK" --network-alias valkey \
            valkey/valkey@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507 \
            --maxmemory-policy noeviction)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if docker exec "$container" valkey-cli ping 2>/dev/null | grep -q PONG; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: make check
        run: make check

      # Last, and deliberately. A ceiling that rose is a decision for an owner
      # to review, not a reason to stop the job before it has said whether the
      # code works. The cleanup below still runs, because it runs always().
      - name: Budgets only ratchet down
        env:
          BUDGET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check_budget_ratchet.sh "$BUDGET_BASE"

      - name: Remove this job's manually created resources
        if: always()
        env:
          NATS_CONTAINER: ${{ steps.setup.outputs.nats }}
          S3_CONTAINER: ${{ steps.s3.outputs.container }}
          VALKEY_CONTAINER: ${{ steps.valkey.outputs.container }}
          RUN: platformkit-${{ github.run_id }}
        run: |
          # Both handles reach the same container: the id the step recorded when it
          # finished, and the name it was given, which is the handle that survives a
          # step the job's own deadline cut off mid-write. `ci-cleanup` skips a handle
          # that names nothing — the step that would have made that container may
          # never have run.
          bash scripts/ci_cleanup.sh \
            "$NATS_CONTAINER" "$RUN-go-checks-nats" \
            "$S3_CONTAINER" "$RUN-go-checks-s3" \
            "$VALKEY_CONTAINER" "$RUN-go-checks-valkey"

  # Second, and load-bearing: the outbox, the request transaction, the advisory
  # locks over a tenant's administration, the limit counters and the router under
  # the race detector. The Makefile target has existed since the concurrency
  # kernel and CONTRIBUTING has said CI runs it, but no workflow ever called it —
  # so the one gate that would notice a lock released before the commit that needs
  # it has only ever run in a contributor's shell. It is its own job rather than a
  # later step of the first because -race roughly doubles the suite: measured at
  # p95 420s on its own, it used to sit behind 464s of `make check` in one job and
  # arrive at the deadline with its verdict unsaid. govulncheck rides along with
  # it: it consumes the build cache the race run just filled, and nothing else
  # needs a moment of it.
  race-and-vuln:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-linux-amd64
    # 2 × this job's own measured p95: one run, job 46911 of run 307,
    # 05:32:11Z → 05:41:34Z = 563s, so 1126s, rounded up — 19 minutes, 1140s. The
    # first price, 17 (990s), was main's step spans: `make check-race` p95 420s
    # (min 219, p50 294, max 433) plus govulncheck p95 20s plus about 55s of setup
    # is 495s, doubled. The job ran 130s past that maximum, and the reason is the
    # split itself: on main 464s of `make check` preceded the race run inside one
    # job, so its step span never carried the checkout, the setup or the store this
    # job starts for itself. The same pin refuses the under-price.
    timeout-minutes: 19
    env:
      PLATFORMKIT_TEST_ADMIN_URL: postgres://postgres:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_DATABASE_URL: postgres://platformkit_app:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_NATS_URL: nats://nats:4222
      # The same store as go-checks, because RACE_PACKAGES names two cases that dial
      # it: kit/httpx's host-invalidation store connections and apps/platformkit's
      # suspension that has to reach a second process. Set for `make check` on main,
      # where one job ran both suites; set here too, so the split does not quietly
      # hand those two cases back the skip they were written not to need.
      PLATFORMKIT_TEST_VALKEY_URL: redis://valkey:6379
      GOFLAGS: -p=4
    services:
      # The database is the runner's own service, in this shape and no other: the
      # runner brings it up, probes it, and puts it on the network every step of this
      # job shares — which is what the `postgres:` host in the URLs above means. It is
      # written per job because a service map cannot be shared without a composite
      # action these runners' support for is not something a checkout can check; what
      # is shared is the rest of the fixture (scripts/ci_setup.sh), and
      # scripts/ci_setup_test.sh refuses a job that calls that script without a
      # database of its own to point at.
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: platformkit
          POSTGRES_DB: platformkit
        options: >-
          --health-cmd "pg_isready -U postgres -d platformkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Start the message bus and the application role
        id: setup
        env:
          JOB_NETWORK: ${{ job.container.network }}
          NATS_CONTAINER_NAME: platformkit-${{ github.run_id }}-race-and-vuln-nats
        run: bash scripts/ci_setup.sh nats app-role

      # The store go-checks starts, for the same reason: two cases in
      # RACE_PACKAGES dial it and fail rather than skip once the URL is set.
      - name: Start Valkey on this job's network
        id: valkey
        env:
          JOB_NETWORK: ${{ job.container.network }}
          CONTAINER_NAME: platformkit-${{ github.run_id }}-race-and-vuln-valkey
        run: |
          test -n "$JOB_NETWORK"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          container=$(docker run -d --name "$CONTAINER_NAME" --network "$JOB_NETWORK" --network-alias valkey \
            valkey/valkey@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507 \
            --maxmemory-policy noeviction)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if docker exec "$container" valkey-cli ping 2>/dev/null | grep -q PONG; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: make check-race
        run: make check-race

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Remove this job's manually created resources
        if: always()
        env:
          NATS_CONTAINER: ${{ steps.setup.outputs.nats }}
          VALKEY_CONTAINER: ${{ steps.valkey.outputs.container }}
          RUN: platformkit-${{ github.run_id }}
        run: bash scripts/ci_cleanup.sh \
          "$NATS_CONTAINER" "$RUN-race-and-vuln-nats" \
          "$VALKEY_CONTAINER" "$RUN-race-and-vuln-valkey"

  # The design tooling and its browsers. Every one of its steps that launches a
  # Chromium used to sit between `make check-race` and `make e2e`, which is the
  # moment the runner had just stopped being asked for memory by a Go suite and
  # started being asked by node: runs 219, 225, 235, 239 and 271 came back
  # `locator.click: Target crashed` and `Unable to capture screenshot` with no
  # assertion anywhere in the log. Here this job's browsers are the only thing
  # this job runs, and no Go suite compiles beside them.
  design-editor:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-linux-amd64
    # No completed run of this job of its own, so no run of its own can price it:
    # its only run, job 46912 of run 307, reports all ten steps — checkout
    # first among them — as failure with null start and end times, and the forge
    # holds no log for it, so it contributes no span. This bound is therefore still
    # main's: 2 × the measured p95 of the sum over 7 complete runs, min 1740s, p50
    # 1745s, p95 1835s → 3670s, and the pin named at the head of this file has no
    # row for a job with no completed run. The first run that reaches a verdict
    # reprices it. The number is ugly and it says why: two of its steps
    # install a Chromium from two different Playwright pins (this directory pins
    # playwright 1.62.1, e2e pins @playwright/test ^1.63.0), and the second install
    # cannot reuse the first build. Aligning those pins is measured to take about
    # 850s off this job, which would make the honest limit 34 minutes; that change
    # touches the design owner's own dependency and is not smuggled into a split.
    timeout-minutes: 62
    env:
      # The suites below build and run Go programs the design tests embed, so this
      # job needs the compiler the Makefile's own toolchain line names. It needs no
      # database and no NATS: nothing under tools/designexport opens either.
      GOFLAGS: -p=4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ''
          package-manager-cache: false

      - name: Native design conformance and dependency audit
        working-directory: tools/designexport/openpencil
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm test

      - name: Install the browser
        working-directory: tools/designexport/openpencil
        run: npx playwright install --with-deps chromium

      - name: Native browser observations
        working-directory: tools/designexport/openpencil
        # The suite's exit code is the verdict — `run` passes it through unchanged. What it
        # adds is the host's account taken *during* the suite: one line every 30 s naming the
        # browsers still alive and the job's own memory, and the full report when the suite
        # fails. See scripts/ci_browser_report.sh and its cases in scripts/ci_browser_report_test.sh.
        run: bash "$GITHUB_WORKSPACE/scripts/ci_browser_report.sh" run observations npm run test:browser

      - name: Corrected editor image builds without publishing
        env:
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
        run: |
          docker build -f tools/designexport/openpencil/Dockerfile -t "$IMAGE" .
          docker build --target preview -f tools/designexport/openpencil/Dockerfile -t "$IMAGE-preview" .
          docker build --target complete-preview -f tools/designexport/openpencil/Dockerfile -t "$IMAGE-complete-preview" .

      - name: Verify editing and downloaded FIG saves in the built editor
        id: editor
        working-directory: tools/designexport/openpencil
        env:
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
          JOB_NETWORK: ${{ job.container.network }}
          PLATFORMKIT_OPENPENCIL_URL: http://openpencil:8080
          CONTAINER_NAME: platformkit-${{ github.run_id }}-editor
        run: |
          test -n "$JOB_NETWORK"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          container=$(docker run -d --name "$CONTAINER_NAME" --network "$JOB_NETWORK" --network-alias openpencil \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 \
            --tmpfs /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101 \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 "$IMAGE")
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null
          # One editor suite at a time. Each file under editor/ launches its own Chromium, and
          # node's default test concurrency is one file per core, so this step handed the runner
          # three browsers at the moment its Go suites had just stopped asking for memory. What
          # comes back from that is not an assertion: the browser dies and the case reports
          # `locator.click: Target crashed` against a five-second wait. The step has refused two
          # of main's own pushes that way (`e32fb81a`, `063b6535`, job logs read by task T-0110
          # round 26). Root reports it refused this branch's head `2be69fa1` too; that run's log
          # was unreadable from here — the forge API answers 403 to an unauthenticated checkout.
          # The directory states a bound for its other browser suite too —
          # `npm run test:browser` runs `--test-concurrency=2`, two browsers and nothing
          # else in this job — and this is the step that never named one.
          # Measured here at this head against this image and the step's own docker flags, on a
          # box at load 18-31 with 38 GB free: unbound, 31 tests in 413.2 s of wall over 475.6 s
          # of test time (ratio 1.15, so at least two files overlap); bound, 31 tests in 441.3 s
          # over 438.6 s (ratio 0.99, and the process tree held one Chromium). Both forms pass
          # all 31 here; only the bound form cannot starve a neighbour. The cost is the overlap:
          # T-0110 round 26 put the same step at 12m49s unbound on CI's runner against about
          # 15m24s serial, inside this job's own limit. No assertion, skip, retry or reordering.
          #
          # And when it fails, the host speaks — while the browsers are still there to be
          # counted. A Chromium the runner reclaimed and a control that never rendered both
          # reach the case as a failed wait; runs 219, 225, 235, 239 and 271 were the first and
          # were read as the second. A report taken after `node --test` returns sees no browser
          # at all, because the suite closed them: the five runs above would each have printed
          # "(no browser process is alive now)", which is the same line a healthy run prints. So
          # `run` keeps a sample of the live process count and the job's memory every 30 s while
          # the suite is up, writes them as it takes them (a step the job limit takes down still
          # leaves them in the log), and prints the full account — OOM lines, cgroup counters,
          # the containers — only when the suite failed. It changes no verdict: the wrapped
          # command's exit code is the step's exit code.
          bash "$GITHUB_WORKSPACE/scripts/ci_browser_report.sh" run editor \
            node --import ./register.mjs --test --test-concurrency=1 editor/*.test.mjs

      - name: Verify both font profiles and visible editable preview text
        id: preview
        working-directory: tools/designexport/openpencil
        env:
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
          JOB_NETWORK: ${{ job.container.network }}
          CONTAINER_NAME: platformkit-${{ github.run_id }}
        run: |
          test -n "$JOB_NETWORK"
          for profile in latin complete; do
            case "$profile" in
              latin) target=preview; test_file=fonts.test.mjs ;;
              complete) target=complete-preview; test_file=complete-fonts.test.mjs ;;
            esac
            export PLATFORMKIT_OPENPENCIL_URL="http://openpencil-$target:8080"
            docker rm -f "$CONTAINER_NAME-$profile" >/dev/null 2>&1 || true
            container=$(docker run -d --name "$CONTAINER_NAME-$profile" --network "$JOB_NETWORK" --network-alias "openpencil-$target" \
              --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 \
              --tmpfs /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101 \
              --tmpfs /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 "$IMAGE-$target")
            echo "$profile=$container" >> "$GITHUB_OUTPUT"
            for i in $(seq 1 30); do
              if curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null
            node --import ./register.mjs --test "preview/$test_file"
          done

      - name: Remove this job's manually created resources
        if: always()
        env:
          EDITOR_CONTAINER: ${{ steps.editor.outputs.container }}
          PREVIEW_CONTAINER: ${{ steps.preview.outputs.latin }}
          COMPLETE_PREVIEW_CONTAINER: ${{ steps.preview.outputs.complete }}
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
          RUN: platformkit-${{ github.run_id }}
        run: |
          status=0
          # By the id the step recorded when it finished, and by the name it gave the
          # container: a step the job limit took down never finished writing its
          # output, and run 245's editor container is the reason main wrote that rule.
          bash scripts/ci_cleanup.sh \
            "$EDITOR_CONTAINER" "$RUN-editor" \
            "$PREVIEW_CONTAINER" "$RUN-latin" \
            "$COMPLETE_PREVIEW_CONTAINER" "$RUN-complete" || status=1
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then docker image rm "$IMAGE" || status=1; fi
          if docker image inspect "$IMAGE-preview" >/dev/null 2>&1; then docker image rm "$IMAGE-preview" || status=1; fi
          if docker image inspect "$IMAGE-complete-preview" >/dev/null 2>&1; then docker image rm "$IMAGE-complete-preview" || status=1; fi
          exit "$status"

  # The journey a person walks: scripts/e2e.sh boots the app on a database of its
  # own and drives it with one Playwright spec. It used to be the last step of a
  # 50-minute job, which is where a job that had already spent its budget on
  # browsers reached it — run 192 is the one that died there with `context deadline
  # exceeded` and nothing failing. Now it is a job of its own, and its own limit.
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-linux-amd64
    # 2 × this job's own measured p95: one run, job 46913 of run 307,
    # 05:25:06Z → 05:29:58Z = 292s, so 584s, rounded up — 10 minutes, 600s. The
    # first price, 8 (480s), was main's step spans: `make e2e` p95 113s over 7 runs
    # (min 102, p50 104) plus the browser install's 57s plus about 55s of setup —
    # 450s. That run spent 61% of 480s, which is not a margin; the pin named at the
    # head of this file refuses it now.
    timeout-minutes: 10
    env:
      PLATFORMKIT_TEST_ADMIN_URL: postgres://postgres:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_DATABASE_URL: postgres://platformkit_app:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_NATS_URL: nats://nats:4222
      GOFLAGS: -p=4
    services:
      # The database is the runner's own service, in this shape and no other: the
      # runner brings it up, probes it, and puts it on the network every step of this
      # job shares — which is what the `postgres:` host in the URLs above means. It is
      # written per job because a service map cannot be shared without a composite
      # action these runners' support for is not something a checkout can check; what
      # is shared is the rest of the fixture (scripts/ci_setup.sh), and
      # scripts/ci_setup_test.sh refuses a job that calls that script without a
      # database of its own to point at.
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: platformkit
          POSTGRES_DB: platformkit
        options: >-
          --health-cmd "pg_isready -U postgres -d platformkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Start the message bus and the application role
        id: setup
        env:
          JOB_NETWORK: ${{ job.container.network }}
          NATS_CONTAINER_NAME: platformkit-${{ github.run_id }}-e2e-nats
        run: bash scripts/ci_setup.sh nats app-role

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ''
          package-manager-cache: false

      # npm ci here, and `make e2e` re-checks the tree against the lock itself:
      # scripts/e2e.sh installs when node_modules disagrees with package-lock.json,
      # and this is the step that pays for the browser binary the spec needs.
      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: make e2e
        run: make e2e

      - name: Remove this job's manually created resources
        if: always()
        env:
          NATS_CONTAINER: ${{ steps.setup.outputs.nats }}
          RUN: platformkit-${{ github.run_id }}
        run: bash scripts/ci_cleanup.sh "$NATS_CONTAINER" "$RUN-e2e-nats"
