# Verification only. The runner supplies a dedicated Docker daemon and a fresh
# job network; no workstation services or deployment credentials are required.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This self-hosted capacity accepts trusted same-repository changes only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-linux-amd64
    # The ceiling this job has carried since the gates moved onto this runner, and
    # the number this change does not touch. Run 43926 (job 44369) reached it at
    # 45m09s, 46 seconds into `make e2e` — a step whose own measured cost on this
    # runner is 103s, and whose whole chain came back green in 43m16s at 0c3a040
    # (job 44137). What had spent the budget in front of those 103 seconds was the
    # design tool's own suite, which shares no database, no runtime and no binary
    # with gate 10; two of its steps now stand in a job of their own below, and
    # both jobs keep this same number. See that job for the seam and its reason.
    timeout-minutes: 45
    env:
      PLATFORMKIT_TEST_ADMIN_URL: postgres://postgres:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_DATABASE_URL: postgres://platformkit_app:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_NATS_URL: nats://nats:4222
      GOFLAGS: -p=4
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: platformkit
          POSTGRES_DB: platformkit
        options: >-
          --health-cmd "pg_isready -U postgres -d platformkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the database client
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql-client

      - name: Start NATS with JetStream on this job's network
        id: nats
        env:
          JOB_NETWORK: ${{ job.container.network }}
        run: |
          test -n "$JOB_NETWORK"
          container=$(docker run -d --network "$JOB_NETWORK" --network-alias nats \
            nats:2-alpine@sha256:ad7a43eb7e3337c3c38ce5d784d1461791f95f730f252d2b25eee699752a0ca3 \
            --jetstream --http_port 8222)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -fsS http://nats:8222/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Create the platformkit_app role
        env:
          PGPASSWORD: platformkit
        run: psql -h postgres -U postgres -d platformkit -v ON_ERROR_STOP=1 -f apps/platformkit/postgres-init.sql

      - name: make check
        run: make check

      # Second, and load-bearing: the outbox, the request transaction, the advisory
      # locks over a tenant's administration, the limit counters and the router under
      # the race detector. The Makefile target has existed since the concurrency
      # kernel and CONTRIBUTING has said CI runs it, but no workflow ever called it —
      # so the one gate that would notice a lock released before the commit that needs
      # it has only ever run in a contributor's shell. It stays a separate step from
      # `make check` because -race roughly doubles the suite; the packages it covers
      # are the Makefile's standing RACE_PACKAGES list, widened by the commit that put
      # advisory locks in modules/auth and modules/user.
      - name: make check-race
        run: make check-race

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ''
          package-manager-cache: false

      # Gate 10's browser: chromium alone, because this is a gate and not a
      # compatibility matrix. The design tool installs its own pinned Playwright in
      # its own job, so nothing here is waiting for a download it does not use.
      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Gate 10, and the step the deadline of run 43926 killed 46 seconds into. It
      # costs 103s on this runner (job 44137) and 176s on a development box, and it
      # used to stand last behind every other gate, which is why the failure that
      # named it said nothing about it. It now follows the Go gates and its own
      # browser, and the budget verdict still runs after it.
      - name: make e2e
        run: make e2e

      # The editor images are built and driven here rather than in `design` for one
      # reason: this block runs its containers on `${{ job.container.network }}`, and
      # this is the job whose container provably has one.
      - name: Corrected editor image builds without publishing
        env:
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
        run: |
          docker build -f tools/designexport/openpencil/Dockerfile -t "$IMAGE" .
          docker build --target preview -f tools/designexport/openpencil/Dockerfile -t "$IMAGE-preview" .
          docker build --target complete-preview -f tools/designexport/openpencil/Dockerfile -t "$IMAGE-complete-preview" .

      - name: Verify editing and downloaded FIG saves in the built editor
        id: editor
        working-directory: tools/designexport/openpencil
        env:
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
          JOB_NETWORK: ${{ job.container.network }}
          PLATFORMKIT_OPENPENCIL_URL: http://openpencil:8080
        run: |
          test -n "$JOB_NETWORK"
          container=$(docker run -d --network "$JOB_NETWORK" --network-alias openpencil \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 \
            --tmpfs /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101 \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 "$IMAGE")
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null
          node --import ./register.mjs --test editor/*.test.mjs

      - name: Verify both font profiles and visible editable preview text
        id: preview
        working-directory: tools/designexport/openpencil
        env:
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
          JOB_NETWORK: ${{ job.container.network }}
        run: |
          test -n "$JOB_NETWORK"
          for profile in latin complete; do
            case "$profile" in
              latin) target=preview; test_file=fonts.test.mjs ;;
              complete) target=complete-preview; test_file=complete-fonts.test.mjs ;;
            esac
            export PLATFORMKIT_OPENPENCIL_URL="http://openpencil-$target:8080"
            container=$(docker run -d --network "$JOB_NETWORK" --network-alias "openpencil-$target" \
              --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 \
              --tmpfs /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101 \
              --tmpfs /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101 "$IMAGE-$target")
            echo "$profile=$container" >> "$GITHUB_OUTPUT"
            for i in $(seq 1 30); do
              if curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "$PLATFORMKIT_OPENPENCIL_URL/healthz" >/dev/null
            node --import ./register.mjs --test "preview/$test_file"
          done

      # Last, and deliberately. A ceiling that rose is a decision for an owner
      # to review, not a reason to stop the job before it has said whether the
      # code works. The cleanup below still runs, because it runs always().
      - name: Budgets only ratchet down
        env:
          BUDGET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check_budget_ratchet.sh "$BUDGET_BASE"

      - name: Remove this job's manually created resources
        if: always()
        env:
          NATS_CONTAINER: ${{ steps.nats.outputs.container }}
          EDITOR_CONTAINER: ${{ steps.editor.outputs.container }}
          PREVIEW_CONTAINER: ${{ steps.preview.outputs.latin }}
          COMPLETE_PREVIEW_CONTAINER: ${{ steps.preview.outputs.complete }}
          IMAGE: platformkit-openpencil:ci-${{ github.run_id }}
        run: |
          status=0
          if [ -n "$EDITOR_CONTAINER" ]; then docker rm -f "$EDITOR_CONTAINER" || status=1; fi
          if [ -n "$PREVIEW_CONTAINER" ]; then docker rm -f "$PREVIEW_CONTAINER" || status=1; fi
          if [ -n "$COMPLETE_PREVIEW_CONTAINER" ]; then docker rm -f "$COMPLETE_PREVIEW_CONTAINER" || status=1; fi
          if [ -n "$NATS_CONTAINER" ]; then docker rm -f "$NATS_CONTAINER" || status=1; fi
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then docker image rm "$IMAGE" || status=1; fi
          if docker image inspect "$IMAGE-preview" >/dev/null 2>&1; then docker image rm "$IMAGE-preview" || status=1; fi
          if docker image inspect "$IMAGE-complete-preview" >/dev/null 2>&1; then docker image rm "$IMAGE-complete-preview" || status=1; fi
          exit "$status"

  # The design tool's own gates, in a job of their own.
  #
  # A deadline belongs to a job, and one job used to carry every gate in this
  # repository one after another. Run 43926 reached 45m09s of that with `make check`
  # and `make check-race` 168s slower than the same steps at 0c3a040 (449s/314s
  # against 345s/250s) — the suite grows with every review round, and this runner's
  # pace varies by more than that between a quiet box and a busy one — and the
  # deadline then expired inside `make e2e`. The two steps that had already spent
  # 924 of those seconds (40s and 884s, in that same run) observe the design tool in
  # Chromium and build the Go programs its tests embed: no service, no database, no
  # port, no application binary. Moving only those is the whole change; the
  # editor-image steps stay in `check` because they run containers on
  # `${{ job.container.network }}`, and whether a job with no service containers is
  # given one is a question the forge answers and this repository cannot — the
  # runner guide states the context exists, not when it is populated. Measured at
  # 0c3a040's pace, `check` is now 28 minutes of steps (31 at the refused head's)
  # and this job 16, each against its own copy of the same 45 that was never raised.
  design:
    # The same trusted-repository rule as `check`: same forge, same self-hosted
    # capacity, same token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-linux-amd64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every design test embeds a real Go program and builds it before observing
      # anything — which is why the Makefile's own check-fixtures target exists — so
      # this job compiles against the pinned toolchain even though it runs no Go gate.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ''
          package-manager-cache: false

      - name: Native design conformance and dependency audit
        working-directory: tools/designexport/openpencil
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm test

      # Its own Playwright and its own chromium: the tooling pins a different build
      # from e2e/'s, and `--with-deps` runs apt itself (measured: it fetches its own
      # package lists), so this job needs no database-client step to reach them.
      - name: Native browser observations
        working-directory: tools/designexport/openpencil
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
