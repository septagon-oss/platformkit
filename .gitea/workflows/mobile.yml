# One device journey, run by the repository that owns the contract the journey
# reads. `make check` proves the catalog address answers and that the published
# document describes it; this job proves a signed-in device can use what it read,
# which nothing else here can.
#
# Why this runner and not a hosted farm: the journey needs a device. The label is
# pkit-ci-android, whose job image (pkit-ci-android:2026-10-05) keeps the Android SDK at
# /opt/android-sdk — with adb in platform-tools and the emulator beside it — the Android
# 35 x86_64 Google APIs AVD, and Maestro at /opt/maestro, on a host that passes
# /dev/kvm into the job container. GitHub's ubuntu-24.04 image, by contrast, lists
# command-line tools and platform-tools and no emulator package and no system image at
# all, and a hosted farm needs an account, a secret and a queue outside this loop, to
# prove one flow. The probe below is the check on that claim: an image that stops
# carrying these fails this job naming the tool it could not find.
#
# Nothing here continues on error. A journey that quietly skipped would leave
# mobile_flow_pass_rate reading like a number nobody earned, which is the failure the
# Makefile names for a suite that skips the transport it ships.
name: mobile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One journey per runner: adb reverse and the emulator are host-level, so a second
  # flow on the same machine would drive the first one's device.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-android
    timeout-minutes: 40
    env:
      PLATFORMKIT_TEST_ADMIN_URL: postgres://postgres:platformkit@postgres:5432/platformkit?sslmode=disable
      # The service name, not localhost, and for the reason ci.yml already uses it
      # there: scripts/mobile_e2e.sh puts this URL in the configuration file of the
      # binary it starts, and that process reaches the database over this job's
      # Docker network, where the container answers at `postgres`. The owner URL is
      # already the service name — the divergence was in this line alone, and a
      # journey whose application cannot connect is a red job nobody would be able
      # to read as anything else.
      PLATFORMKIT_TEST_DATABASE_URL: postgres://platformkit_app:platformkit@postgres:5432/platformkit?sslmode=disable
      PLATFORMKIT_TEST_NATS_URL: nats://nats:4222
      PLATFORMKIT_MOBILE_PORT: '8098'
      # Which shell build the kernel tests against, and how often that pin moves, is
      # the mobile owner's: both values are set on the repository, and the harness
      # refuses to run when either is missing rather than downloading something it
      # cannot name. The digest is checked before anything is installed. The URL is
      # deliberately not a job-level entry: "Fetch the pinned shell build" reads it
      # from the repository itself, authorises the download with the job's token, and
      # exports PK_MOBILE_APK as a file:// URL on the job environment. No job-level
      # entry of that name stands here, and that is the point of the arrangement and
      # not its mechanism: whether a job's env: outranks a $GITHUB_ENV export is
      # act_runner's ordering, which nothing in this repository establishes, so a
      # second PK_MOBILE_APK could outrank the export and hand the harness the
      # sign-in-gated URL back — the failure this step exists to remove.
      # scripts/mobile_journey_fetch_test.sh refuses a job-level entry by that name on
      # that reading alone, without waiting for the ordering to be measured.
      PK_MOBILE_APK_SHA256: ${{ vars.PK_MOBILE_APK_SHA256 }}
      PK_MOBILE_AVD: ${{ vars.PK_MOBILE_AVD }}
      # Where the harness leaves the report so this job can print it: the journey's own
      # work directory is removed whichever step failed, and the report outlives it.
      PK_MOBILE_REPORT: maestro.xml
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: platformkit
          POSTGRES_DB: platformkit
        options: >-
          --health-cmd "pg_isready -U postgres -d platformkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # First, and on purpose. A job this runner kills - a cancelled run, a ceiling reached, the
      # lost-execution shape the header of this file describes - never reaches the `if: always()`
      # cleanup at the end, so the containers it started stay on that host holding memory, and a
      # runner holding a running container never reads idle. 2026-10-06 counted 13 SeaweedFS
      # containers between the three kernel runners, some 19 hours old, each from a job that had
      # ended long before; the ones over three hours old were removed by hand, and while they stood,
      # the runners could not be restarted for reading busy.
      #
      # Every container this program starts by hand carries `--label pkit.ci.run=<run id>`, so this
      # step finds them with `docker ps -aq --filter label=pkit.ci.run`. `-a`, not `-q`: the
      # running-only filter does not see a stopped container, and a SeaweedFS whose process died is
      # stopped, still on disk, still holding the memory its data directory took. Measured on this
      # host's daemon (Docker 29.8.2) with two labelled containers, one created and never started
      # and one started and let exit: `docker ps -q --filter label=pkit.ci.run` listed neither once
      # both had stopped, `docker ps -aq --filter label=pkit.ci.run` listed both.
      #
      # The age bound is more than twice this job's own 40-minute ceiling, so no live job's container is in range. The
      # label is a namespace the whole program shares, and a sweep here reaches every container on
      # this daemon that carries it, including another repository's CI started with the same label;
      # the bound is what makes that safe, and it holds only while every job that uses the label has
      # a ceiling below half of it. `docker inspect -f '{{.Created}}'` is UTC to the nanosecond and
      # GNU `date -u -d` parses it.
      #
      # Best-effort, and it never fails the job: a container that vanishes between the listing and
      # the removal, or one another job is winning the race for, is not this job's failure, and a
      # runner with nothing to sweep is the normal case, not a finding.
      - name: Remove containers a killed job left on this runner
        env:
          SWEEP_OLDER_THAN: '10800'
        run: |
          cutoff=$(( $(date -u +%s) - SWEEP_OLDER_THAN ))
          swept=0
          for id in $(docker ps -aq --filter label=pkit.ci.run); do
            created=$(docker inspect -f '{{.Created}}' "$id" 2>/dev/null) || continue
            epoch=$(date -u -d "$created" +%s 2>/dev/null) || continue
            [ "$epoch" -le "$cutoff" ] || continue
            docker rm -f "$id" >/dev/null 2>&1 || continue
            echo "swept $id created $created"
            swept=$(( swept + 1 ))
          done
          echo "removed $swept container(s) created more than ${SWEEP_OLDER_THAN}s ago"

      # One commit, for the reason ci.yml's `design` job now gives at length: this job's steps are apt,
      # docker, an emulator and one goal, `make mobile-e2e`, which is one line calling
      # scripts/mobile_e2e.sh, and that script names no git object (grep -rnwi git answers 0 lines).
      # The fetch `fetch-depth: 0` asks for is unbounded and this job's ceiling is 40 minutes, so a
      # slow forge took the journey with it; scripts/ci_checkout_history_test.sh keeps the two claims
      # pinned. Not run here: the journey needs this host's emulator, and no device ran in this round.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Name what this host owes a device journey
        # First, and it is the step that decides whether the rest can mean anything.
        # This job runs on the pkit-ci-android label, whose image keeps adb and the
        # emulator under /opt/android-sdk (ANDROID_HOME) and Maestro under
        # /opt/maestro/bin (MAESTRO_HOME), and puts all three on PATH; the search below
        # still walks the older prefixes, because a developer's machine keeps the SDK
        # wherever its installer put it and exports nothing. Saying which tool is missing
        # is worth more than a red test two minutes later, and more than a green job that
        # ran nothing.
        run: |
          for dir in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Android/Sdk"; do
            [ -n "$dir" ] || continue
            for part in platform-tools emulator; do
              [ -x "$dir/$part" ] && PATH="$dir/$part:$PATH"
            done
          done
          # The same prefixes scripts/mobile_e2e.sh searches, and for the same
          # reason: Maestro is a launch script plus a lib directory, so a host that
          # has it keeps it under a tools prefix of its own — $MAESTRO_HOME on this
          # image, ~/.local/share/platformkit-tools on the machine that installed it —
          # and a CI shell does not always have that prefix on PATH. A probe narrower
          # than the harness's own search would refuse this job for a tool the journey
          # would have found.
          for dir in "${MAESTRO_HOME:-}" "${MAESTRO_HOME:+$MAESTRO_HOME/bin}" "${XDG_DATA_HOME:-$HOME/.local/share}/platformkit-tools/maestro/bin"; do
            [ -n "$dir" ] || continue
            [ -x "$dir/maestro" ] && PATH="$dir:$PATH"
          done
          export PATH
          missing=()
          for tool in adb emulator maestro psql python3; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          [ -r /dev/kvm ] || missing+=("/dev/kvm (readable)")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "This runner cannot run the device journey; missing: ${missing[*]}" >&2
            echo "Label: pkit-ci-android. Either the image gains them or the flow" >&2
            echo "moves to a runner that has them; it does not get skipped." >&2
            exit 1
          fi
          # The path, not just the name: "found" is a claim about a search scope,
          # and the next reader needs to see which scope this one had.
          for tool in adb emulator maestro; do
            echo "$tool: $(command -v "$tool")"
          done
          adb version
          emulator -version | head -3

      - name: Install the database client and prepare the role
        env:
          PGPASSWORD: platformkit
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql-client
          psql -h postgres -U postgres -d platformkit -v ON_ERROR_STOP=1 -f apps/platformkit/postgres-init.sql

      - name: Start NATS with JetStream on this job's network
        id: nats
        env:
          JOB_NETWORK: ${{ job.container.network }}
          # Named after the run, as ci.yml's services are: this job's cleanup reads
          # steps.nats.outputs.container, which is exactly the handle a job cut off mid-step never
          # writes, and the journey's ceiling is 40 minutes of emulator.
          CONTAINER_NAME: platformkit-${{ github.run_id }}-nats
        run: |
          test -n "$JOB_NETWORK"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          container=$(docker run -d --name "$CONTAINER_NAME" --label pkit.ci.run=${{ github.run_id }} --network "$JOB_NETWORK" --network-alias nats \
            nats:2-alpine@sha256:ad7a43eb7e3337c3c38ce5d784d1461791f95f730f252d2b25eee699752a0ca3 \
            --jetstream --http_port 8222)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -fsS http://nats:8222/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Boot the emulator headless
        id: emulator
        run: |
          if [ -z "$PK_MOBILE_AVD" ]; then
            echo "PK_MOBILE_AVD names no Android Virtual Device on this image." >&2
            exit 1
          fi
          emulator -avd "$PK_MOBILE_AVD" -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect >emulator.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              adb devices
              exit 0
            fi
            sleep 2
          done
          echo "the emulator did not finish booting:" >&2
          tail -40 emulator.log >&2
          exit 1

      - name: Fetch the pinned shell build with the job's token
        # Gitea answers an anonymous download of a release asset with the sign-in page,
        # so the harness's plain curl would hash a login page and refuse it on the
        # digest. The job therefore downloads the pin with its own token into the job's
        # work directory, checks it against PK_MOBILE_APK_SHA256 here, and hands the
        # harness a file:// URL it can open without signing in; the harness's own digest
        # check still runs on that file, so the pin is checked twice and trusted once.
        # When the variables are unset this refuses naming them, as the harness would:
        # the download is not the place a missing pin becomes a green step.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PK_MOBILE_APK: ${{ vars.PK_MOBILE_APK }}
        run: |
          if [ -z "$PK_MOBILE_APK" ] || [ -z "$PK_MOBILE_APK_SHA256" ]; then
            echo "mobile-e2e: PK_MOBILE_APK and PK_MOBILE_APK_SHA256 are both required: which shell build this journey runs against is the mobile owner's to name, and an unpinned download is not a test." >&2
            exit 1
          fi
          test -n "$RUNNER_TEMP" || { echo "RUNNER_TEMP is unset: this job has no work directory to fetch the shell build into." >&2; exit 1; }
          dest="$RUNNER_TEMP/shell.apk"
          if ! curl -fsSL --header "Authorization: token $GITHUB_TOKEN" "$PK_MOBILE_APK" -o "$dest"; then
            echo "the job could not download PK_MOBILE_APK with its own token: the pin names something this forge will not hand to this job." >&2
            exit 1
          fi
          if ! echo "$PK_MOBILE_APK_SHA256  $dest" | sha256sum --check --status; then
            echo "the file downloaded from $PK_MOBILE_APK is not the build PK_MOBILE_APK_SHA256 names; nothing is installed." >&2
            exit 1
          fi
          echo "PK_MOBILE_APK=file://$dest" >> "$GITHUB_ENV"

      - name: make mobile-e2e
        run: make mobile-e2e

      - name: The report, in the job's own log
        if: always()
        run: |
          if [ -s "$PK_MOBILE_REPORT" ]; then
            cat "$PK_MOBILE_REPORT"
          else
            echo "no Maestro report at $PK_MOBILE_REPORT: the journey did not reach its report." >&2
            exit 1
          fi

      - name: Remove this job's emulator and NATS container
        if: always()
        env:
          EMULATOR_PID: ${{ steps.emulator.outputs.pid }}
          NATS_CONTAINER: ${{ steps.nats.outputs.container }}
          NATS_NAME: platformkit-${{ github.run_id }}-nats
        run: |
          status=0
          if [ -n "$EMULATOR_PID" ]; then kill "$EMULATOR_PID" 2>/dev/null || true; fi
          # Both handles reach the same container: the id this job's step recorded, when it finished
          # writing it, and the name the run cannot lose. The step output alone was the leak.
          for handle in "$NATS_CONTAINER" "$NATS_NAME"; do
            [ -n "$handle" ] || continue
            docker inspect "$handle" >/dev/null 2>&1 || continue
            docker rm -f "$handle" || status=1
          done
          pkill -f 'emulator -avd' 2>/dev/null || true
          exit "$status"
